name = "icareu-contact"
main = "worker.js"
compatibility_date = "2024-11-01"

# Secrets are NOT set here. See README.md:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put CHAT_ID

# Required. Without it the relay refuses every request, which is
# deliberate — an unset origin list would otherwise mean any site on the
# web can post into the study team's inbox in this project's name.
[vars]
ALLOWED_ORIGIN = "https://aci.icareu.cc"

# Optional per-address rate limit. Uncomment to cap how fast one caller can
# post; the worker treats it as optional, so the relay works with or
# without it.
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1101"
# simple = { limit = 5, period = 60 }
