name: Seed demo data

# Manual only. Populates the DEPLOYED database with the synthetic demo
# organisation, role accounts, participants, community and messaging
# fixtures, then prints the identifiers for the dev-header sign-in stub.
# Idempotent: a second run reports the existing accounts and changes
# nothing. SYNTHETIC DATA ONLY (ADR-062) — never point this at a database
# holding real personal data.
#
# The optional wipe reverts every migration first, which DROPS EVERY TABLE
# AND EVERY ROW in the deployed database. It is guarded by a typed word
# rather than a checkbox: a checkbox next to "seed" is one mis-click away
# from destroying an environment, and this cannot be undone.
on:
  workflow_dispatch:
    inputs:
      wipe:
        description: 'Destroy all data first? Type WIPE to confirm. Anything else seeds without deleting.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Wipe the deployed database (irreversible; only on typed confirmation)
        if: inputs.wipe == 'WIPE'
        run: |
          DBURL=$(gcloud secrets versions access latest --secret=HADI_DATABASE_URL --project "${{ vars.GCP_PROJECT_ID }}")
          echo "::add-mask::$DBURL"
          echo "::warning::Reverting every migration. All data in the deployed database is being destroyed."
          # Down-all then up: the schemas and their contents go, and the
          # structure comes back empty for the seed step to fill. If the
          # re-apply fails the job stops here, leaving a loud failure rather
          # than a running service pointed at half a database.
          DATABASE_URL="$DBURL" pnpm migrate:reset
          DATABASE_URL="$DBURL" pnpm migrate
          echo "Database reset. Every identifier issued before this run is now invalid."

      - name: Seed
        run: |
          DBURL=$(gcloud secrets versions access latest --secret=HADI_DATABASE_URL --project "${{ vars.GCP_PROJECT_ID }}")
          echo "::add-mask::$DBURL"
          DATABASE_URL="$DBURL" DEMO_JSON_OUT=/tmp/demo.json pnpm seed:demo | tee /tmp/seed.out
          # The identifiers are not secrets (they are opaque synthetic ids
          # for a stub sign-in), so they go to the run summary where they
          # are easy to copy.
          {
            echo '## Demo accounts'
            echo '```'
            sed -n '/=== Demo accounts/,$p' /tmp/seed.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the seeded participant through the deployed API
        # Seeding the database proves nothing about what the browser sees.
        # This replays the exact requests the participant workspace makes —
        # same access token, same dev-header identity — so "the screen is
        # empty" can be attributed to the server or the client with evidence
        # rather than guesswork.
        run: |
          URL=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE || 'hadi-platform' }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION || 'us-east1' }}" \
            --format='value(status.url)')
          TOKEN=$(gcloud secrets versions access latest --secret=HADI_ACCESS_TOKEN --project "${{ vars.GCP_PROJECT_ID }}" 2>/dev/null || true)
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"
          ACTOR=$(node -e "console.log(require('/tmp/demo.json').participantActorId ?? '')")
          PID=$(node -e "console.log(require('/tmp/demo.json').participantId ?? '')")
          SPACE=$(node -e "console.log(require('/tmp/demo.json').spaceId ?? '')")
          echo "participant actor=$ACTOR participant=$PID space=$SPACE"

          call() {
            printf '\n--- %s\n' "$1"
            curl -s -o /tmp/body.json -w 'HTTP %{http_code}\n' --max-time 30 \
              -H "x-actor-id: $ACTOR" -H "x-access-token: $TOKEN" "$URL$1"
            head -c 800 /tmp/body.json; echo
          }
          call "/v1/participants/$PID/community-spaces"
          FAILED=0
          grep -q '"CommunitySpace"' /tmp/body.json || FAILED=1
          call "/v1/participants/$PID/community-spaces/$SPACE/feed"
          grep -q '"SocialPost"' /tmp/body.json || FAILED=1
          call "/v1/participants/$PID/conversation-threads"
          grep -q '"ConversationThread"' /tmp/body.json || FAILED=1
          call "/v1/participants/$PID/connections"
          grep -q '"Connection"' /tmp/body.json || FAILED=1
          if [ "$FAILED" != "0" ]; then
            echo "::error::the deployed API did not return the seeded data for this participant"
            exit 1
          fi
          echo "OK: spaces, feed, threads and connections all returned seeded data"
