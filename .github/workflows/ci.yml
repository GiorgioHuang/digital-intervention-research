name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_dev_only
          POSTGRES_DB: research_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d research_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://platform:platform_dev_only@localhost:5432/research_platform
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json —
      # single source of truth; specifying it here too makes the action fail.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      # `pnpm build` compiles sources only; the web tsconfig is the one that
      # also covers test files. Without this step a type error in a test
      # passed CI and reached main — it did, which is why the step exists.
      - name: Typecheck (includes test files)
        run: pnpm typecheck

      - name: Architecture boundaries (dependency-cruiser)
        run: pnpm depcruise

      - name: Traceability matrix check
        run: pnpm traceability:check

      - name: Research traceability matrix check
        run: pnpm traceability:research

      - name: Migration drill (up → down-all → up)
        run: |
          pnpm migrate
          pnpm migrate:reset
          pnpm migrate

      - name: Tests (unit + integration)
        # KNOWLEDGE_MCP_URL points the M10 real-call suite at the deployed
        # Healthy Aging Knowledge Graph MCP endpoint (Cloud Run + Neon), so
        # every push exercises genuine JSON-RPC round trips. The suite
        # probes /health first and skips honestly if the service is down —
        # availability of an external dependency must not flake the build.
        env:
          # The deployed knowledge-graph endpoint is a repository Variable, not a
          # literal here: this repository is public and its workflow logs are
          # public with it. Unset (as in any fork) the real-call test skips
          # honestly rather than pretending to pass.
          KNOWLEDGE_MCP_URL: ${{ vars.KNOWLEDGE_MCP_URL }}
        run: pnpm test

      # Runs against the populated post-test database: dump -> restore
      # into a fresh drill database -> verify row counts, structure, and
      # that the audit append-only guarantee survives restore.
      - name: Backup/restore drill
        run: pnpm drill:backup
