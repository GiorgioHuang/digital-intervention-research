name: Deploy to Cloud Run

# CI/CD chain: runs after the CI workflow succeeds on main (plus manual
# dispatch). Keyless auth via Workload Identity Federation — no long-lived
# keys in GitHub. DATABASE_URL and the access token live in GCP Secret
# Manager (HAIP_DATABASE_URL / HAIP_ACCESS_TOKEN), injected at deploy time.
# Until the repo Variables below are configured the workflow skips with a
# notice instead of failing (one-time setup: scripts/setup-gcp.sh, see
# DEPLOYMENT.md).
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write # keyless Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploy only what CI has fully verified (tests + drills), never a red build.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check deploy configuration
        id: cfg
        run: |
          if [ -n "${{ vars.GCP_PROJECT_ID }}" ] && [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] && [ -n "${{ vars.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_PROJECT_ID / GCP_WIF_PROVIDER / GCP_SERVICE_ACCOUNT repo Variables not set — skipping deploy. One-time setup: scripts/setup-gcp.sh (see DEPLOYMENT.md)."
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          # Deploy exactly the commit CI verified, not whatever main moved to.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: auth
        if: steps.cfg.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.cfg.outputs.enabled == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Run database migrations against Neon
        if: steps.cfg.outputs.enabled == 'true'
        # Migrations run BEFORE the new revision deploys (all migrations are
        # reversible and drilled in CI, so the old revision keeps working
        # during rollout). The connection string never leaves Secret Manager
        # unmasked.
        run: |
          if ! gcloud secrets describe HAIP_DATABASE_URL --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            echo "::error::HAIP_DATABASE_URL secret not found in Secret Manager — create the Neon database and store its URL (see DEPLOYMENT.md)."
            exit 1
          fi
          DBURL=$(gcloud secrets versions access latest --secret=HAIP_DATABASE_URL --project "${{ vars.GCP_PROJECT_ID }}")
          echo "::add-mask::$DBURL"
          pnpm install --frozen-lockfile
          DATABASE_URL="$DBURL" pnpm migrate

      - name: Ensure the runtime SA can read secrets
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          NUM=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)' 2>/dev/null || true)
          [ -z "$NUM" ] && { echo "::warning::could not resolve project number; skipping secret IAM"; exit 0; }
          RUNTIME_SA="${NUM}-compute@developer.gserviceaccount.com"
          for S in HAIP_DATABASE_URL HAIP_ACCESS_TOKEN; do
            if gcloud secrets describe "$S" --project "$PROJECT" >/dev/null 2>&1; then
              gcloud secrets add-iam-policy-binding "$S" --project "$PROJECT" \
                --member "serviceAccount:${RUNTIME_SA}" \
                --role roles/secretmanager.secretAccessor -q >/dev/null 2>&1 \
                && echo "  granted accessor on $S" || echo "::warning::could not bind $S"
            fi
          done

      - name: Deploy
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          SECRETS="DATABASE_URL=HAIP_DATABASE_URL:latest"
          # Fail closed on exposure (THREAT_MODEL: the dev-header auth stub
          # must never be publicly reachable unguarded): with the
          # HAIP_ACCESS_TOKEN secret present the service is public behind
          # the X-Access-Token gate; without it, ingress stays IAM-only.
          if gcloud secrets describe HAIP_ACCESS_TOKEN --project "$PROJECT" >/dev/null 2>&1; then
            SECRETS="$SECRETS,ACCESS_TOKEN=HAIP_ACCESS_TOKEN:latest"
            AUTH_FLAG="--allow-unauthenticated"
            echo "::notice::HAIP_ACCESS_TOKEN found — public ingress behind the access-token gate."
          else
            AUTH_FLAG="--no-allow-unauthenticated"
            echo "::notice::HAIP_ACCESS_TOKEN secret not found — deploying with IAM-only ingress (fail closed). Create the secret to open the token-gated public URL."
          fi
          ENVVARS="AUTH_MODE=dev-header,WEB_DIST_DIR=/app/apps/web/dist,RUN_JOBS=${{ vars.RUN_JOBS || 'true' }},COMMIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}"
          # Real Knowledge Graph integration (ADR-052/110): the deployed
          # platform talks to the live MCP endpoint.
          ENVVARS="$ENVVARS,KNOWLEDGE_PLATFORM_MODE=mcp,KNOWLEDGE_MCP_URL=${{ vars.KNOWLEDGE_MCP_URL || 'https://knowledge-graph.internal.example' }}"
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE || 'haip-platform' }}" \
            --source . \
            --project "$PROJECT" \
            --region "${{ vars.GCP_REGION || 'us-east1' }}" \
            "$AUTH_FLAG" \
            --port 8080 \
            --cpu 1 --memory 1Gi \
            --min-instances "${{ vars.MIN_INSTANCES || '0' }}" --max-instances 3 \
            --update-secrets "$SECRETS" \
            --update-env-vars "$ENVVARS"

      - name: Show URL
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE || 'haip-platform' }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION || 'us-east1' }}" \
            --format='value(status.url)'
