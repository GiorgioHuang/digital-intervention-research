name: Deploy to Cloud Run

# CI/CD chain: runs after the CI workflow succeeds on main (plus manual
# dispatch). Keyless auth via Workload Identity Federation — no long-lived
# keys in GitHub. DATABASE_URL and the access token live in GCP Secret
# Manager (HADI_DATABASE_URL / HADI_ACCESS_TOKEN), injected at deploy time.
# Until the repo Variables below are configured the workflow skips with a
# notice instead of failing (one-time setup: scripts/setup-gcp.sh, see
# DEPLOYMENT.md).
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write # keyless Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploy only what CI has fully verified (tests + drills), never a red build.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check deploy configuration
        id: cfg
        run: |
          if [ -n "${{ vars.GCP_PROJECT_ID }}" ] && [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] && [ -n "${{ vars.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_PROJECT_ID / GCP_WIF_PROVIDER / GCP_SERVICE_ACCOUNT repo Variables not set — skipping deploy. One-time setup: scripts/setup-gcp.sh (see DEPLOYMENT.md)."
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          # Deploy exactly the commit CI verified, not whatever main moved to.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: auth
        if: steps.cfg.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.cfg.outputs.enabled == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Run database migrations against Neon
        if: steps.cfg.outputs.enabled == 'true'
        # Migrations run BEFORE the new revision deploys (all migrations are
        # reversible and drilled in CI, so the old revision keeps working
        # during rollout). The connection string never leaves Secret Manager
        # unmasked.
        run: |
          if ! gcloud secrets describe HADI_DATABASE_URL --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            echo "::error::HADI_DATABASE_URL secret not found in Secret Manager — create the Neon database and store its URL (see DEPLOYMENT.md)."
            exit 1
          fi
          DBURL=$(gcloud secrets versions access latest --secret=HADI_DATABASE_URL --project "${{ vars.GCP_PROJECT_ID }}")
          echo "::add-mask::$DBURL"
          pnpm install --frozen-lockfile
          DATABASE_URL="$DBURL" pnpm migrate

      - name: Ensure the runtime SA can read secrets
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          NUM=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)' 2>/dev/null || true)
          [ -z "$NUM" ] && { echo "::warning::could not resolve project number; skipping secret IAM"; exit 0; }
          RUNTIME_SA="${NUM}-compute@developer.gserviceaccount.com"
          for S in HADI_DATABASE_URL HADI_ACCESS_TOKEN HADI_SESSION_SECRET HADI_R2_ACCESS_KEY_ID HADI_R2_SECRET_ACCESS_KEY; do
            if gcloud secrets describe "$S" --project "$PROJECT" >/dev/null 2>&1; then
              gcloud secrets add-iam-policy-binding "$S" --project "$PROJECT" \
                --member "serviceAccount:${RUNTIME_SA}" \
                --role roles/secretmanager.secretAccessor -q >/dev/null 2>&1 \
                && echo "  granted accessor on $S" || echo "::warning::could not bind $S"
            fi
          done

      - name: Deploy
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          SECRETS="DATABASE_URL=HADI_DATABASE_URL:latest"
          # Fail closed on exposure (THREAT_MODEL). The rule is about the
          # STUB, not about the token: what must never be publicly
          # reachable unguarded is a deployment where identity is whatever
          # a header says. So the token is one way to be guarded and real
          # authentication is the other, and this used to know only the
          # first — written when it was the only one there was.
          #
          # Leaving it that way meant that deleting the access token to
          # open self-signup, which is the documented way to open it, took
          # the site to IAM-only and off the internet. The compensating
          # control was holding the door open for the thing that replaced
          # it.
          ACCESS_TOKEN_PRESENT=false
          if gcloud secrets describe HADI_ACCESS_TOKEN --project "$PROJECT" >/dev/null 2>&1; then
            ACCESS_TOKEN_PRESENT=true
            SECRETS="$SECRETS,ACCESS_TOKEN=HADI_ACCESS_TOKEN:latest"
          fi
          # Sign in with Google (ADR-104), switched on by the presence of
          # its configuration rather than by a flag day. Both halves or
          # neither: the client ID has nothing to verify against without
          # the nonce-signing secret, and the API refuses to start on half
          # a configuration anyway — better to notice that here, where the
          # notice is read, than in a container that will not boot.
          #
          # Until both exist the deployment stays on the dev-header stub,
          # which is the state this has always been in and is honest about.
          AUTH_MODE=dev-header
          if [ -n "${{ vars.GOOGLE_CLIENT_ID }}" ] && gcloud secrets describe HADI_SESSION_SECRET --project "$PROJECT" >/dev/null 2>&1; then
            AUTH_MODE=google
            SECRETS="$SECRETS,SESSION_SECRET=HADI_SESSION_SECRET:latest"
            echo "::notice::AUTH_MODE=google — real authentication (ADR-104). The dev-header stub is off; x-actor-id is ignored."
          elif [ -n "${{ vars.GOOGLE_CLIENT_ID }}" ]; then
            echo "::warning::GOOGLE_CLIENT_ID is set but the HADI_SESSION_SECRET secret is missing — staying on the dev-header stub. Create the secret to switch on Sign in with Google."
          else
            echo "::notice::GOOGLE_CLIENT_ID not set — deploying on the dev-header stub (identity is whatever a header says). See DEPLOYMENT.md 开启 Google 登录."
          fi
          # Guarded either by real authentication or by the shared token;
          # unguarded only when neither, and that stays off the internet.
          if [ "$AUTH_MODE" = google ] || [ "$ACCESS_TOKEN_PRESENT" = true ]; then
            AUTH_FLAG="--allow-unauthenticated"
            echo "::notice::public ingress — guarded by AUTH_MODE=$AUTH_MODE, access-token gate present: $ACCESS_TOKEN_PRESENT."
          else
            AUTH_FLAG="--no-allow-unauthenticated"
            echo "::notice::dev-header stub with no access token — IAM-only ingress (fail closed). Configure Sign in with Google, or create HADI_ACCESS_TOKEN, to open the public URL."
          fi
          # Object storage (Cloudflare R2, S3-compatible). All four
          # settings or none: the platform refuses to start on a partial
          # configuration rather than writing participants' files into a
          # Postgres column, so this block must never attach some of them.
          # The account id and bucket are not secret; the key pair is.
          R2_PRESENT=true
          for S in HADI_R2_ACCESS_KEY_ID HADI_R2_SECRET_ACCESS_KEY; do
            gcloud secrets describe "$S" --project "$PROJECT" >/dev/null 2>&1 || R2_PRESENT=false
          done
          [ -n "${{ vars.R2_ACCOUNT_ID }}" ] && [ -n "${{ vars.R2_BUCKET }}" ] || R2_PRESENT=false
          ENVVARS="AUTH_MODE=$AUTH_MODE,WEB_DIST_DIR=/app/apps/web/dist,RUN_JOBS=${{ vars.RUN_JOBS || 'true' }},COMMIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}"
          if [ "$R2_PRESENT" = true ]; then
            SECRETS="$SECRETS,R2_ACCESS_KEY_ID=HADI_R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=HADI_R2_SECRET_ACCESS_KEY:latest"
            ENVVARS="$ENVVARS,R2_ACCOUNT_ID=${{ vars.R2_ACCOUNT_ID }},R2_BUCKET=${{ vars.R2_BUCKET }}"
            echo "::notice::R2 configured — uploaded bytes go to the object store."
          else
            echo "::notice::R2 not configured — uploaded bytes stay in the Postgres simulator. Set the R2_ACCOUNT_ID and R2_BUCKET variables and the HADI_R2_ACCESS_KEY_ID and HADI_R2_SECRET_ACCESS_KEY secrets to use the object store." 
          fi
          if [ "$AUTH_MODE" = google ]; then
            ENVVARS="$ENVVARS,GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}"
            [ -n "${{ vars.GOOGLE_ALLOWED_DOMAINS }}" ] && ENVVARS="$ENVVARS,GOOGLE_ALLOWED_DOMAINS=${{ vars.GOOGLE_ALLOWED_DOMAINS }}"
            [ -n "${{ vars.GOOGLE_MFA_DOMAINS }}" ] && ENVVARS="$ENVVARS,GOOGLE_MFA_DOMAINS=${{ vars.GOOGLE_MFA_DOMAINS }}"
            [ -n "${{ vars.ALLOW_SELF_SIGNUP }}" ] && ENVVARS="$ENVVARS,ALLOW_SELF_SIGNUP=${{ vars.ALLOW_SELF_SIGNUP }}"
          fi
          # Carried to the smoke step, which is a separate shell.
          echo "R2_PRESENT=$R2_PRESENT" >> "$GITHUB_ENV"
          echo "AUTH_MODE_DEPLOYED=$AUTH_MODE" >> "$GITHUB_ENV"
          # Real Knowledge Graph integration (ADR-052/110): the deployed
          # platform talks to the live MCP endpoint.
          # No literal fallback: with KNOWLEDGE_MCP_URL unset the service keeps
          # the deterministic simulator rather than being pointed at a host
          # written into a public repository.
          if [ -n "${{ vars.KNOWLEDGE_MCP_URL }}" ]; then
            ENVVARS="$ENVVARS,KNOWLEDGE_PLATFORM_MODE=mcp,KNOWLEDGE_MCP_URL=${{ vars.KNOWLEDGE_MCP_URL }}"
          fi
          # The staff workspace's addresses are compiled into the web
          # bundle, because the browser is what decides which surface it
          # is showing. Written as Vite's own env file rather than a
          # build argument, because `gcloud run deploy --source .` hands
          # Cloud Build the source and takes no --build-arg. Unset means
          # one address with every door — the split is a deployment
          # choice, not a code change.
          if [ -n "${{ vars.STAFF_HOSTS }}" ]; then
            echo "VITE_STAFF_HOSTS=${{ vars.STAFF_HOSTS }}" > apps/web/.env.production
            echo "::notice::staff workspace served on: ${{ vars.STAFF_HOSTS }}"
          else
            rm -f apps/web/.env.production
            echo "::notice::STAFF_HOSTS not set — one address serves every workspace, with the staff and supporter doors on the participant sign-in screen."
          fi
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE || 'hadi-platform' }}" \
            --source . \
            --project "$PROJECT" \
            --region "${{ vars.GCP_REGION || 'us-east1' }}" \
            "$AUTH_FLAG" \
            --port 8080 \
            --cpu 1 --memory 1Gi \
            --min-instances "${{ vars.MIN_INSTANCES || '0' }}" --max-instances 3 \
            --set-secrets "$SECRETS" \
            --set-env-vars "$ENVVARS"

      - name: Cloud Build log (on failure)
        # `gcloud run deploy --source` only prints "check build logs for
        # details" — the actual compiler/installer error lives in Cloud
        # Build. Surface its tail here so a failed deploy is diagnosable
        # from the Actions run alone.
        if: failure() && steps.cfg.outputs.enabled == 'true'
        run: |
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          BUILD=$(gcloud builds list --project "$PROJECT" --region "${{ vars.GCP_REGION || 'us-east1' }}" \
            --limit 1 --format='value(id)' 2>/dev/null || true)
          if [ -z "$BUILD" ]; then
            BUILD=$(gcloud builds list --project "$PROJECT" --limit 1 --format='value(id)' 2>/dev/null || true)
          fi
          if [ -z "$BUILD" ]; then echo "::warning::no Cloud Build id found"; exit 0; fi
          echo "== Cloud Build $BUILD (last 200 lines) =="
          gcloud builds log "$BUILD" --project "$PROJECT" --region "${{ vars.GCP_REGION || 'us-east1' }}" 2>/dev/null \
            | tail -200 \
            || gcloud builds log "$BUILD" --project "$PROJECT" 2>/dev/null | tail -200 \
            || echo "::warning::could not fetch build log"

      - name: Smoke-test the deployed revision
        if: steps.cfg.outputs.enabled == 'true'
        # A deploy that reports success but serves a broken container is
        # worse than a failed deploy, so the revision has to answer for
        # itself: liveness, the SPA shell, and the access-token gate
        # actually refusing an ungated /v1 request.
        run: |
          URL=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE || 'hadi-platform' }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION || 'us-east1' }}" \
            --format='value(status.url)')
          # Masked, and kept out of the run summary. This repository is
          # public, and so are its workflow logs and summaries: printing the
          # service URL there publishes the deployment address to anyone who
          # opens a build. The same `::add-mask::` treatment the database URL
          # already gets above.
          echo "::add-mask::$URL"
          echo "Deployed revision answered; URL withheld from public logs." >> "$GITHUB_STEP_SUMMARY"

          # First request may cold-start the instance; allow a few attempts.
          for i in 1 2 3 4 5 6; do
            HEALTH=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 30 "$URL/health" || echo 000)
            [ "$HEALTH" = "200" ] && break
            echo "  health attempt $i: HTTP $HEALTH — retrying"
            sleep 10
          done
          echo "health: HTTP $HEALTH"; cat /tmp/health.json 2>/dev/null || true; echo
          [ "$HEALTH" = "200" ] || { echo "::error::deployed revision is not healthy"; exit 1; }

          # Where the deployed revision is actually putting uploaded files.
          # Reported by the service itself rather than inferred from what
          # this workflow attached: the settings can be right here and the
          # process still be running an older revision.
          # Retried, like the liveness and gate checks above it. The first
          # version of this had no retry and failed on a cold instance
          # that had not finished starting — a check failing for a reason
          # other than the thing it tests, which is the defect the gate
          # retry was added for. Readiness also touches the database, so
          # it is ready later than liveness by definition.
          READY=000
          for i in 1 2 3 4 5 6; do
            READY=$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 30 "$URL/ready" || echo 000)
            [ "$READY" = "200" ] && break
            echo "  ready attempt $i: HTTP $READY — retrying"
            sleep 10
          done
          echo "ready: HTTP $READY"; cat /tmp/ready.json 2>/dev/null || true; echo
          [ "$READY" = "200" ] || { echo "::error::deployed revision never became ready"; exit 1; }
          STORE=$(sed -n 's/.*"fileStorage":"\([^"]*\)".*/\1/p' /tmp/ready.json)
          echo "file storage: ${STORE:-unreported}"
          # Three outcomes, kept apart. No answer is not the same as the
          # wrong answer: the first says this check could not be made, the
          # second says the deployment is not doing what was attached.
          [ -n "$STORE" ] || { echo "::error::readiness answered 200 without a fileStorage field — this check could not be made"; exit 1; }
          if [ "$R2_PRESENT" = true ] && [ "$STORE" != "object-store" ]; then
            echo "::error::R2 was attached, but the running revision reports fileStorage=$STORE"
            exit 1
          fi
          if [ "$R2_PRESENT" != true ] && [ "$STORE" = "object-store" ]; then
            echo "::error::no object store was attached, yet the running revision reports one"
            exit 1
          fi

          SHELL_CODE=$(curl -s -o /tmp/index.html -w '%{http_code}' --max-time 30 "$URL/" || echo 000)
          grep -q "<div id=\"root\"" /tmp/index.html \
            || { echo "::error::web app not served (HTTP $SHELL_CODE)"; exit 1; }
          echo "web shell: HTTP $SHELL_CODE, root element present"

          # Same cold-start allowance as the liveness check above, and for
          # the same reason: this request can land on a second instance
          # that is still starting, which answers 500 before the app's
          # middleware exists to answer 401. A deploy that fails for a
          # reason other than the thing it is testing is worse than no
          # check — it teaches whoever is watching to press re-run, which
          # is exactly how a genuine "gate is not enforcing" gets waved
          # through one day.
          #
          # ONLY the ambiguous answers are retried. A gate that had failed
          # open would answer 200, 403 or 404 — stable and not 5xx — and
          # that must fail immediately rather than being given six more
          # chances to look transient. A gate that is genuinely broken
          # keeps answering 500 and still fails when the attempts run out.
          for i in 1 2 3 4 5 6; do
            GATED=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              -H 'x-actor-id: smoke' "$URL/v1/participants/smoke/community-spaces" || echo 000)
            case "$GATED" in
              000|5??) echo "  gate attempt $i: HTTP $GATED — instance may still be starting; retrying"; sleep 10 ;;
              *) break ;;
            esac
          done
          echo "ungated /v1: HTTP $GATED"
          if gcloud secrets describe HADI_ACCESS_TOKEN --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            [ "$GATED" = "401" ] || { echo "::error::access-token gate is NOT enforcing (expected 401, got $GATED)"; exit 1; }
            echo "access-token gate enforcing"
          fi
