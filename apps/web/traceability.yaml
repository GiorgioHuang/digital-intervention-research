- implementation_id: IMP-WEB-STAFF-QUEUES-DESKTOP-001
  module: WEB
  summary: >-
    All eight staff screens walked in the new desktop layout with the API running, demo data seeded
    and a real sign-in, each one screenshotted and checked structurally for page-level horizontal
    scroll, elements overflowing their container, touch targets under 44px and unwrapped tables.
    Structurally they were clean. Looking at them showed the desktop work was half done. On a 1920px
    screen the approvals queue put four protocol versions in a single 502px column with a thousand
    pixels empty beside them: a panel's sections flow into columns, so the queue section was one
    column, and the content the width had been widened for never received any of it. Moving the
    navigation to a rail and leaving the queue as a ribbon is not a desktop layout. Two more, both
    only visible by looking: queue items were bare articles with no border and no background, so four
    records ran together and "Refuse this version" was followed immediately by the next record's
    "Type" - a reviewer deciding one case at a time cannot see where one ends - and the fact lists put
    every label on its own line with the value indented beneath, spending twelve lines on six facts.
    Three general rules fix all eight screens: queue sections span every column, queue items become
    cards, and the definition lists lay out as aligned label and value. Fixing the lists ran into the
    same wrong-diagnosis pattern twice more. The first guess was grid items defaulting to min-width
    auto - the third instance today of a default that would rather overflow than shrink - and adding
    min-inline-size: 0 changed nothing at all. Measuring found a different cause with an identical
    symptom: these lists are not uniform dt/dd pairs, the later ones wrap each pair in a div, and that
    wrapper enters the grid as a single item whose max-content width took the label column to 377px
    and left the value column at 0. display: contents on the wrapper plus explicit column numbers on
    dt and dd make both shapes lay out alike.
  trace_ids: [ATR-003]
  adr_ids: [ADR-061, ADR-062]
  docs:
