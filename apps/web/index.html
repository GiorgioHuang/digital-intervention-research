<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      §D.6: the title is the same on every screen and says nothing about
      who is using it. A tab reading "Participant Workspace" on a shared
      tablet tells the room that whoever last sat here is in the study,
      which is the one fact the study is least entitled to broadcast. The
      screen name is carried by the <h1> instead, where it belongs.
    -->
    <title>Healthy Ageing Research Platform</title>
    <!--
      The tab icon. Checked against §D.6 above rather than added past it: that
      ruling forbids the tab saying WHO is using the platform, because a tab
      reading "Participant Workspace" on a shared tablet tells the room that
      whoever last sat here is in the study. A brand mark says which site is
      open, which the title already says in words — it adds no fact the tab
      was not already carrying, and it distinguishes nobody.

      SVG only, and deliberately no `apple-touch-icon`: that wants a square
      180x180 raster, neither supplied PNG is square, and a wordmark
      letterboxed or cropped through the middle of the mark is worse than the
      platform's default. Source in `design/brand/`.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
