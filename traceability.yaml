- implementation_id: IMP-M15-AUDIT-READ-001
  module: M15
  summary: The platform's accountability record can be read. Sixty-one call sites write governance audit events and nothing anywhere read one - the store was append-only by database trigger and unreadable by any human being, while audit.view had been granted to three roles since the permission catalogue was written without a single line of code ever checking it. The recording was complete, correct and fail-closed, and no one could ever see it. listAuditEvents is the one reader, gated on audit.view and bounded on the server. Reading the audit is itself an audited action as the specification requires - a record whose readers leave no trace is the one record a misuser has no reason to avoid - so the read is written into the same append-only store, with the reader's stated reason and their filters, before any rows come back. If that write fails the read does not happen, which is the same fail-closed rule the commands follow and matters more here than anywhere. A migration adds access_reason and query_filters to audit_events, nullable and left null by all sixty-one command writes since a command has no reader and no query. That closes the condition D-6 named for itself - the reason field was ruled not mandatory precisely because nothing stored it, and a required box whose contents are discarded is a promise the platform does not keep - so the field is now required. The screen says what the record does not contain before showing a single row. No read of anything is ever written, so it cannot answer who looked at a participant's file. And although the result column permits Allowed and Denied, no code has ever written either value, so a refused attempt leaves no trace at all and somebody searching for an abuse would find nothing. An empty result says explicitly that this is not the same as nothing having happened
