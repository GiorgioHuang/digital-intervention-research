- implementation_id: IMP-M18-BLOCK-OWNERSHIP-001
  module: M18
  summary: Fixes an authorisation defect in blocking and makes the undo promise real. block.create and block.revoke carried only confirmationRequired, so holding the Participant role was the entire check - the engine never compared the named blocker with the caller. An integration test written to prove the point confirmed it rather than refuting it - an unrelated participant successfully revoked another participant's active block, and could equally have placed one in someone else's name. A block is the one protection a participant can put in place without asking anyone, and the person with the strongest motive to remove it is the person it was placed against. Two things were wrong and both are fixed. The actions now carry ownerPermitted and ownerOnly, and revokeBlock reads the blocker from the block record instead of accepting it from the caller, with the same condition repeated in the UPDATE clause - ownerOnly alone would not have closed it, because a stranger could pass their own identifier as the blocker, satisfy the ownership comparison, and still have the update match on the block id alone. That is the same lesson as the organisation-scope defect recorded in D-13, arriving from a different direction - authority named by the request is not authority. The route and client no longer send a blocker at all. Separately, the block confirmation has always told participants they can undo a block at any time while nothing listed a block or offered to lift one, which is a promise the product did not keep - you cannot undo what you cannot see. Adds block.view-own and listMyBlocks, and a section on the safety screen that lists active blocks and lifts them, with wording that does not overclaim - unblocking restores no connection or permission that existed before, and brings back nothing missed in the meantime. The blocked person's name is shown where it resolves and the identifier the participant typed otherwise, deliberately not the shared placeholder used in community listings, which would make two blocks impossible to tell apart on the one screen where telling them apart is the whole task
  trace_ids: [ATR-016, ATR-002]
  adr_ids: [ADR-037, ADR-038, ADR-050]
  docs: ["design/UI_INVENTORY.md B7", "design/UI_INVENTORY.md B17", "design/DESIGN_DECISIONS.md D-13", "Doc 20 section 168"]
