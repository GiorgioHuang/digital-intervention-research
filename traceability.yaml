- implementation_id: IMP-M10-EVIDENCE-DECISION-001
  module: M10
  summary: Evidence decisions and their snapshots are reachable. A decision can be written from a review and agreed by a second person, and agreeing writes an immutable EvidenceSnapshot in the same transaction whose content hash the screen shows - that snapshot is what later work cites, so the confirmation says this is the last point at which the wording can change and that a different conclusion later has to be a new decision. Three things the vocabulary has to hold. The outcome list is the platform's and not one invented in the interface - the database refuses anything outside it, and Approved, Rejected and Provisional are deliberately not outcomes, because an outcome answers what the evidence says while approval answers who agreed, and collapsing the two would let a decision read as settled merely because somebody signed it. Conflicting Evidence is a first-class outcome worded as a finding in its own right rather than as a failure to reach one, since a vocabulary offering only support or refusal pushes whoever writes the decision into overstating one side. And conflicting is kept distinct from insufficient - found and disagreeing is not the same as barely found at all. A decision may be drafted from a review nobody has approved, because the command permits it, so both screens state that plainly rather than narrowing the control - an interface that quietly forbids what the server allows is inventing a rule, and the approver screen additionally says that agreeing a decision does not approve the review under it. The queue read uses a new evidence-decision.view-queue rather than the confirmationRequired approval action, the same split made for the review queue in the previous increment
