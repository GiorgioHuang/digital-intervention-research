- implementation_id: IMP-M01-ROLE-REVOCATION-001
  module: M01
  summary: Access can be taken back. revokeRole has existed since M01 was written, with its permission check, its optimistic version guard, its domain event and its audit entry, and it had no route and no screen anywhere; user.view was granted to the organisation administrator and the coordinator and was checked by no code at all; and nothing listed an account or a role. So access on this platform could be given and never taken back - a coordinator who left the study, a researcher whose involvement ended, an account that should have been shut down, none of it could be touched from any screen, and the only thing standing between a former colleague and a participant's records was that nobody had thought to look. The listing is scoped to the caller's organisation from the request context and never from an argument, because a listing that accepts an organisation identifier is a way of asking which organisations exist. Revoking is confirmed and version-bound, so a role that changed underneath is refused rather than merged. Two things the screen must not overstate. Revoking a role is not closing an account - account_state carries five values and no code writes any of them, so Active is the column default rather than anybody's decision, and showing it as a status would answer a question the platform was never asked; the screen says outright that accounts cannot be closed here, that removing every role is the only way to stop somebody, and that the platform cannot stop them signing in at all. And revoking removes what a person may do next rather than what they did - their records stay, their name stays on their decisions and the audit trail keeps their actions, which is what an audit trail is for and would surprise anybody who read revoke as erase. The test asserts that the next evaluation after revocation is DenyAndHideExistence with reason no-granting-role, not a plain denial, because a former colleague learning that a participant exists is the thing revocation was meant to prevent
