- implementation_id: IMP-REFUSAL-VISIBLE-001
  module: M04
  summary: The person whose work was refused can find out why. The previous increment gave approvers a way to say no and stored the reason, and then no query returned it and no screen showed it - a hole of exactly the kind this sweep exists to close, created by the fix itself. A refusal nobody can read is only a disappearance with a label on it, and a state that says Not approved and stops there tells someone their work failed and nothing about what to do next. The refusal reason and the refuser now travel with every summary the author can see - evidence reviews, evidence decisions, analysis plans and research findings - and a shared block renders them where the state is shown, quoting the reason, naming who decided, and saying that nothing has been deleted. The refuser is named on purpose - a decision recorded in someone's name and then shown anonymously to the person it lands on is half an attribution, and the missing half is the one they need in order to reply. The larger gap was the protocol chain, where nothing listed a researcher's own versions at all - a version was drafted, submitted, and then left every screen, its fate learned by asking somebody. A new query returns the versions of a project with their state, approver and refusal, read under the same permission that already allows drafting one, because seeing what became of your own submission is not a separate authority from making it. Each state is given plain wording so the list is readable without knowing the state machine
