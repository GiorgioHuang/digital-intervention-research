- implementation_id: IMP-POLICY-UNCHECKED-ACTIONS-ARE-NAMED-001
  module: POLICY
  summary: Ten actions the catalogue declares and grants to roles are checked by no command anywhere. A permission nothing checks grants nothing, so none of them is a way in - what they are is a claim, because this catalogue is the platform's statement of what a role may do and is read as one, by whoever decides which role to give somebody and by anyone auditing what a role could have done. The ten described capabilities the platform does not have. A research approver who cannot approve or activate a project, because project_state has no writer and no command moves it. A moderator with a triage step that was never built, only the decision. A participant with a life-story export command that does not exist, the real export going through M14 under participant.export. A protocol review step that is not part of the lifecycle, which is draft, submit, approve, activate or refuse. A system.configure with no configuration surface at all. And participant.view-assigned, which is the permission that would let staff read a participant's record - there is no such read path, staff screens read enrolments. evidence-snapshot.create is different in kind, since snapshots are genuinely written but only ever inside approving an evidence decision under ADR-044, so one creatable on its own would break that rule rather than implement it. Two are deliberate and stay. safety-signal.record must never be checked, because somebody raising a concern about another person's safety is never refused for want of a role, and the command says so at its definition. participant.view-shared is inert by the ruling in D-39, and every screen naming it says in those words that it grants nothing. They are kept rather than deleted, each with its reason written beside it, because deleting them would lose the intention they record. The test derives the same set from the module and route sources and asserts equality rather than containment, so it fails in both directions - a new unchecked action cannot appear quietly, and implementing one of these fails until it is taken off the list. It also pins the other derived set in the catalogue, the actions a relationship can authorise, against the requirements the engine actually consults a relationship for
