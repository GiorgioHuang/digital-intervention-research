- implementation_id: IMP-DECISIONS-ASSESSMENT-UPLOAD-001
  module: DOCS
  summary: The last two unexamined gaps are recorded as decisions rather than left as unexplained holes. M08 assessment holds one command with no query, route or screen, like delivery did - but unlike delivery it cannot be built honestly, because recordAssessment requires an instrument and an instrument version and nothing in the platform defines an instrument at all. The column is unconstrained free text with no bank, no versions and no scoring rules, so a screen would ask a coordinator to invent a measurement instrument's name and version and then record scores against it, and an assessment record carrying an invented instrument name is worse than no record because it reads as though something was measured. D-17 ruled the participant side out for that reason, since the questions are approved research material that an implementer must not invent, and the same reasoning holds for staff. The file upload pipeline is the opposite case - it is genuinely implemented, with completion moving an object to Quarantined and writing its checksum, and a scan then moving it to Available or Rejected - and it simply has no interface, so a participant cannot attach anything and the life story is text only. A second reason found on checking, harder than the wording constraint - an uploaded file cannot be seen again. assignObject records ownership on the object side, the life story schema holds no reference back to objects, and no query lists objects for an owning resource at all, only a single object by its identifier. So a participant could attach a photo to a life story entry that the life story can never show them, unless they had memorised the object identifier - which makes upload not one increment but two, the read path included. It is otherwise buildable, under one hard constraint on the wording - the scanner recognises the EICAR test string and a marker that forces a scan failure, so it is a simulator rather than an antivirus engine, and a screen saying a file was scanned for viruses would be a safety promise the platform cannot keep. This entry also records a defect in the sweep that produced several of this session's findings - it extracted identifiers with a pattern excluding digits, so checksum_sha256 was truncated and wrongly reported as never referenced. Corrected, the sweep drops from forty columns to thirty-one. No shipped claim was affected, because every claim that landed was about whether a column has a writer and each was verified separately by its own search
  trace_ids: [ATR-013]
  adr_ids: [ADR-020]
  docs: ["design/UI_INVENTORY.md B15", "design/DESIGN_DECISIONS.md D-17", "design/DESIGN_DECISIONS.md D-49", "design/DESIGN_DECISIONS.md D-50"]
