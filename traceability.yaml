- implementation_id: IMP-WEB-APPROVER-SCREENS-001
  module: ops
  summary: Approver workspace split into one screen per decision type (protocol versions, dataset locks, exports, approval records) with the queue as the only route to a decision, replacing a single panel whose four decisions were driven by typed identifier fields. That panel carried the defect RESEARCHER_WORKSPACE §1.5 names outright - the queue said "that is you, so you cannot approve it" while the approve button under the identifier field stayed enabled, so a self-approval was clickable and then refused with a 403; the decide control is now unavailable on your own submission and no identifier field exists to route around it. Each decision shows the exact artefact it binds to in the same view as the control per §1.4 - type, identifier, version number and content hash, with the hash in full in the confirmation, which required exposing content_hash through the M04 in-review query since the column existed but was never read. Protocol and dataset decisions re-read the artefact immediately before applying and refuse if its hash or timestamp moved, so a decision is never applied to a version the approver has not seen; export and approval-record queues carry no version marker, and the screen says so rather than implying staleness detection it does not have. Dataset locking states outright that approver and locker may be the same person (decision D-11, matching what lockDatasetVersion already enforces - version state and the dataset.lock permission, nothing about the definition's approver) rather than staying silent and leaving someone who approved the definition to guess whether they may lock it; the M12 lockable query now returns the definition's approver so each row names them and marks when that is the reader, because permitted is not the same as invisible. Authentication tiering is stated both ways per §1.6 - approving a protocol version, locking a dataset, and deciding an export or approval record announce the strong-authentication requirement, while activating a protocol version is stated as needing confirmation only, because over-warning is the same class of error as under-warning; export rejection carries the same notice and the same separation-of-duties bar as approval, since both go through export.approve
