- implementation_id: IMP-WEB-PROPOSE-RELATIONSHIP-001
  module: M03
  summary: A coordinator can bring a supporter into a participant's study. POST /v1/relationships had no caller anywhere in the product, so the whole supporter path - a family member seeing what the participant chooses to share, offering additions to their life story, the participant approving or refusing them - could only be started by whoever could call the API directly, and in the demo it existed because the seed made it. Two things carry this screen. Proposing grants nothing - the participant approves it themselves and until then the person named can do nothing at all - said before the form rather than after it, because a coordinator who believed otherwise would tell a family member they now have access. And the list of what the relationship may permit contains exactly the two actions any relationship actually gates, participant.view-shared and life-story.contribute, because every other action in the platform is decided by role or by ownership and would never consult that list; a longer menu would record permissions nothing reads, leaving a supporter told they may do something they cannot or a participant believing they limited something they did not. The screen names that limit rather than letting a short list look arbitrary, and each permission says what it still depends on, since without the matching consent it permits nothing. A relationship permitting nothing cannot be proposed at all, because it would be a record with no effect. Scoping this turned up a further finding recorded as a decision rather than built - conversation threads can only rest on a matched connection, so a participant can message a stranger the algorithm suggested but not the family member they themselves approved, and the wording for that basis has sat unreachable in the messages screen from the start. Building it now would be a one-way write into nothing, because the other party to a relationship is an actor rather than a participant and the thread list is keyed by participant, so a supporter could never read what was written to them
