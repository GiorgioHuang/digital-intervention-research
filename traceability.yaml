- implementation_id: IMP-M14-OWN-EXPORT-001
  module: M14
  summary: A participant can ask for a copy of their own information and see what happened to the request. Requesting was owner-permitted from the start and the route existed, but nothing in the participant workspace reached it, so this right existed only for whoever knew the API - the same shape as the withdrawal gap fixed earlier. Adding only a button would have been half the fix, because a request whose outcome the requester cannot see is indistinguishable from one that was never made and a rejection would read exactly like silence. Adds export.view-own as ownerPermitted and ownerOnly, kept separate from participant.export because that action is confirmationRequired and a read forced to claim confirmation is a read pretending to be a command, plus listMyExportRequests and a participant screen. The wording never promises delivery - the request is reviewed by someone who is not the person who asked, which the database enforces by refusing an approver equal to the requester, and each state says only what is true of it, so Approved is not written as generated and Generated is not written as delivered. Asking carries no reason from the participant, because the right to a copy of your own information is not conditional on explaining why you want it. An open request is reported as already open rather than offering a second one, since asking twice would not make it faster. The deciding approver is deliberately not returned to the requester - who decided is on the audit record, and naming them turns a governance decision into a person to argue with
