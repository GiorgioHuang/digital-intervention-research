- implementation_id: IMP-WEB-CALM-TEAL-WARM-SAND-THEME-001
  module: WEB
  summary: >-
    The owner's visual direction - Calm Teal & Warm Sand - applied to a design system whose every
    colour already carried a measured contrast ratio. Copying the palette in as given would have
    broken half of it: measured against the surfaces it is actually used on, Warning #B7791F is
    3.42:1, Sand #C9955C is 2.48:1 and Text Muted #74817E is 3.80:1 - each fine as a border, none of
    them legible as text. A single value cannot be both, so the choice would have been between a
    border too faint to see and words too faint to read, and both are wrong. Resolved by splitting
    every family in two: the graphic tier (3:1, used for borders, icons, state bars) keeps the
    owner's values exactly, and the text tier (4.5:1) darkens the same colour by uniform RGB scaling,
    which leaves HSL hue and saturation untouched - #287C78 to #267571 is 177/51/32 to 177/51/30, the
    owner's teal at a lower lightness rather than a different green. The layer people see as colour
    is the owner's palette unchanged. The part worth recording is the damage the correct-looking move
    nearly did. Deriving every colour to the same minimum leaves hue intact and flattens lightness,
    so everything lands on one rung: the first derivation produced three blues (safety, info,
    matching) 1.25:1 apart, a moderation border byte-identical to the primary button, and a
    moderation text colour 1.07:1 from the link colour. All of it passed the contrast tests, because
    contrast measures a colour against its background and says nothing about its siblings. Safety went
    back to a deep navy and moderation to a teal deeper than the button, guarded by a new assertion
    that no two families may share a value and none may equal the primary action colour - a state
    must not look like a button. Two further pieces. DESIGN_SYSTEM.md has asked since v0.1 for the
    contrast table to be asserted in a test, calling it the one automation gate the document
    recommends; it had never been built, and re-palletising is precisely when it becomes
    load-bearing, since none of the ratios true of the old blue are true of the new teal. It reads
    the real stylesheet rather than a copy of the values, because a test holding its own colour table
    would only be asserting that the same hex was typed twice. Scanning the components then turned up
    23 inline styles - style={{ border '1px solid currentColor', padding '1rem' }} - drawing the
    community spaces, matching suggestions, message threads and consent scopes as hand-rolled boxes
    that never thicken to 3px in high contrast, never respond to the density preference, and take
    their border colour from whatever text colour surrounds them. A stylesheet cannot see that, so
    the test reads the component sources too. Dark mode is not a priority per the owner, but the
    product already ships the toggle, so it was retuned to the same teal and held to the same test:
    not a priority is not the same as allowed to be wrong. Running the app and looking at it then
    found two more defects that only an eye can find. The "this is a shared device" checkbox was being
    stretched to full row width by the generic input rule and its label pushed to the line below, so
    it read as an empty box rather than a tick box - invisible to the tests, because they find
    controls by label and that path was never broken. That control shortens the idle timeout from
    twenty minutes to five, puts a cover-the-screen and sign-out action on every page, and keeps
    nothing on the device after the browser closes; an older adult at a community centre who does not
    recognise it as a tick box leaves their health data on a machine other people use. And the sign-in
    screen drew three identical teal outline buttons with nothing saying which one was the way in -
    .btn-primary already existed and was simply never applied. Fixing the checkbox went wrong once
    first: `width: auto` and `inline-size` are the same property, so writing the former after the
    latter cancelled the size too and left the box smaller than the body text. The cancelling
    declaration was never needed, since the type selector already outranks the generic input rule. Wiring
    the zone accents into Life Story, Community and Matching walked into the same trap a second time: the
    three .card--* edge rules were written above .card, so .card's `border` shorthand overrode all of them
    and the three kinds of card rendered identically. Four tests stayed green throughout, because what they
    assert is that the class name is present, and it was. Same property, later declaration wins - twice in
    one change, both times invisible to tests and visible at a glance. The zone accents are a 4px edge
    rather than a fill: a structural line survives greyscale, low-stimulation mode and colour vision
    deficiency, and a wash of colour does not.
