- implementation_id: IMP-M03-CONSENT-STATE-001
  module: M03
  summary: A participant can see their own current consent position, read from consent_permission.consent_current - the same projection the permission engine consults when it decides whether an action is allowed, so the screen cannot claim one thing while the server enforces another. The screen previously showed only the result of a button pressed in that session, so someone returning to it saw nothing at all and could not tell what they had agreed to; a consent screen that cannot state the standing position is not a record of anything. Each scope now also states what it actually controls, and shows the consent text version the decision was made under. The offered set grows from four scopes to the six the platform genuinely enforces - the two that were missing, supporter-involvement and supporter-contribution, are precisely the ones governing what another person may read and contribute, so a participant could not review or withdraw supporter access from their own consent screen while the server was gating on it. Decision D-2 asks for all 22 scopes from Doc 20 §97; that is recorded as partially implemented rather than done, because consent_current.consent_scope has no CHECK constraint and accepts any string - adding sixteen controls that record a decision no permission check reads would assert a protection the platform does not provide, the same error D-5 exists to prevent. The read is owner-only through participant.view-own, and a request for someone else's decisions is refused as RESOURCE_NOT_FOUND rather than distinguishing non-existence from not-yours
  trace_ids: [ATR-002, ATR-024]
  adr_ids: [ADR-018, ADR-050, ADR-054]
