- implementation_id: IMP-M03-RECONSENT-001
  module: M03
  summary: The platform can say that a consent text has changed. ReConsentRequired has been a permitted consent decision since the tables were written, the permission engine reads it and refuses everything the affected scope gates until the participant answers, and the error catalogue carries a message for the outcome - a complete, working mechanism for "the terms you agreed to have changed" that nothing anywhere could trigger. A consent text could be revised and every participant would carry on under an agreement to wording that no longer existed, while their own consent screen said Granted at them. The writer is consent.require-reconsent, granted to the ResearchApprover because they are who approved the version that changed the wording, confirmed because it stops things the participant is relying on at the moment it is recorded, and deliberately not ownerPermitted since this is the one thing about somebody's consent that another person does and it runs the opposite way to granting. Three refusals matter more than the write. There must be an agreement to supersede, or the control changes nothing while telling the person who pressed it that they acted. The version must differ from the one they agreed to, or it stops their access and gives them nothing new to read. And a note saying what changed is required - a migration adds decision_note to the decision history and the projection - because a demand to agree again that does not say what changed is not a request but an obstruction, leaving the participant no way to judge what they are being asked to judge and no real option but to agree. The participant's screen states it in the present tense, that this has already stopped rather than being about to, shows what changed, and says that declining leaves things stopped and takes nothing else away - not their other choices and not their place in the study
