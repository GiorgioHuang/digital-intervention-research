- implementation_id: IMP-M03-CONSENT-STATE-001
  module: M03
  summary: A participant can see their own current consent position, read from consent_permission.consent_current - the same projection the permission engine consults when it decides whether an action is allowed, so the screen cannot claim one thing while the server enforces another. The screen previously showed only the result of a button pressed in that session, so someone returning to it saw nothing at all and could not tell what they had agreed to; a consent screen that cannot state the standing position is not a record of anything. Each scope now also states what it actually controls, and shows the consent text version the decision was made under. The offered set grows from four scopes to the six the platform genuinely enforces - the two that were missing, supporter-involvement and supporter-contribution, are precisely the ones governing what another person may read and contribute, so a participant could not review or withdraw supporter access from their own consent screen while the server was gating on it. Decision D-2 asks for all 22 scopes from Doc 20 §97; that is recorded as partially implemented rather than done, because consent_current.consent_scope has no CHECK constraint and accepts any string - adding sixteen controls that record a decision no permission check reads would assert a protection the platform does not provide, the same error D-5 exists to prevent. The read is owner-only through participant.view-own, and a request for someone else's decisions is refused as RESOURCE_NOT_FOUND rather than distinguishing non-existence from not-yours
  trace_ids: [ATR-002, ATR-024]
  adr_ids: [ADR-018, ADR-050, ADR-054]
  docs: ["design/DESIGN_DECISIONS.md D-2", "design/PARTICIPANT_WORKSPACE.md A2.4", "Doc 4 consent model", "Doc 20 §97-98"]
  code: [packages/modules/m03-consent-permission/src/application/consent-queries.ts, apps/api/src/controllers.ts, apps/web/src/components/ConsentPanel.tsx, apps/web/src/api.ts]
  tests: [packages/modules/m03-consent-permission/test/m03.integration.test.ts, apps/web/test/consent-panel.test.tsx]
  status: implemented

- implementation_id: IMP-WEB-COMMUNICATION-BASIS-001
  module: ops
  summary: Every conversation states why the two people may write to each other, and a conversation that can no longer be written to says so before it is opened (PARTICIPANT_WORKSPACE A3.1/A3.3/A3.5/A4.2/A4.3). A thread exists only on a CommunicationBasis (ADR-031) and the server already returned which one, but the screen never showed it - the reason a person is reachable is the whole permission story, and a participant who cannot see it has no way to understand why one person can be written to and another cannot, or what would end that. The four basis types each get plain wording, and a thread whose state is not Active carries the reason on the list row and again inside the conversation, so nobody composes a message only to be refused after spending the effort. Conversations, connections and message history now load on arrival instead of behind a button, with a loading state; the buttons remain as explicit refresh. Also closes a CI gap this work exposed - pnpm build compiles sources only, and the web tsconfig is the one that also covers test files, so a type error in a test passed CI and reached main; a typecheck step now runs in CI
  trace_ids: [ATR-002, ATR-024]
  adr_ids: [ADR-031]
  docs: ["design/PARTICIPANT_WORKSPACE.md A3.1", "design/PARTICIPANT_WORKSPACE.md A3.3", "design/PARTICIPANT_WORKSPACE.md A3.5", "Doc 20 §158-161"]
  code: [apps/web/src/components/MessagesScreen.tsx, apps/web/src/components/MessagePanel.tsx, .github/workflows/ci.yml]
  tests: [apps/web/test/messages-screen.test.tsx, apps/web/test/message-panel.test.tsx]
  status: implemented

- implementation_id: IMP-WEB-SIGNIN-PAIRING-001
  module: ops
  summary: The participant sign-in checks that the two identifiers belong to the same person, and a signed-in person can get back to the form. Reported from the deployed environment as "the message list will not load" with RESOURCE_NOT_FOUND; reproduced locally against the real API, where a matching actor/participant pair returns 200 and an unpaired one returns exactly that 404. The code was not at fault, but the product made the situation a dead end - nothing verified the pairing at sign-in, so an unpaired combination signed in happily and then every owner-scoped screen returned a protected-existence 404 whose wording can only say "the identifier may be incorrect", with no way to tell which one and no control anywhere to change identity short of reloading the page. This is reachable without any user error at all - every identifier issued before a demo reseed stops working while a session is open. The sign-in now makes one owner-scoped request and reports an unusable pair in a sentence, deliberately without naming which identifier is wrong, since that would answer "does this participant exist" for anyone who asked (ADR-050); a 401 is distinguished as the environment passphrase rather than misreported as a pairing problem; and a check that fails for any other reason still signs in, because refusing would punish someone for a problem that is not theirs. Help and safety gains a sign-out that returns to the form
  trace_ids: [ATR-002, ATR-023]
  adr_ids: [ADR-050, ADR-104]
  docs: ["design/DESIGN_SYSTEM.md §E", "Doc 20 §224-237"]
  code: [apps/web/src/App.tsx]
  tests: [apps/web/test/sign-in.test.tsx]
  status: implemented

- implementation_id: IMP-WEB-SEND-HONESTY-001
  module: ops
  summary: The send confirmation now says that confirming is not delivery, and a draft containing an external link raises an inline reminder (PARTICIPANT_WORKSPACE A4.4/A4.5, Doc 20 §160/§161/§163). The dialog previously showed only recipient, version and content, so the one thing a person most needs before pressing send - that this hands the message to a delivery service rather than delivering it - was visible only afterwards in the delivery label, too late to inform the decision; it now also names the communication basis. Attachment and scan state from §160 are deliberately not added, because this implementation has no attachments and a line about scanning would assert a check that does not exist. The link reminder is inline rather than a dialog, since it is a reminder and not a decision, it never judges the other person, and it carries the "this is only a reminder" footnote. It offers three actions rather than the specified five - Not now, Change the message, and Get help block or report, which really navigates to Help and safety where blocking and reporting live rather than being a button that goes nowhere. Not now deliberately does not clear the text - the reassuring option must never be the destructive one, and the draft stays saved
  trace_ids: [ATR-024, ATR-016]
  adr_ids: [ADR-031]
  docs: ["design/PARTICIPANT_WORKSPACE.md A4.4", "design/PARTICIPANT_WORKSPACE.md A4.5", "Doc 20 §160-163"]
  code: [apps/web/src/components/MessagePanel.tsx, apps/web/src/components/MessagesScreen.tsx, apps/web/src/App.tsx]
  tests: [apps/web/test/message-panel.test.tsx]
  status: implemented

- implementation_id: IMP-M18-ASSISTED-DISCLOSURE-001
  module: M18
  summary: Assisted mode as read-only assistance with disclosure to the recipient (decision D-15). The helper never acts for the participant, so no second identity is introduced - ActorReference and the audit table are unchanged, because who did what was already true when only the participant can press anything. What the feature adds is honesty about who is present. The participant turns it on and off themselves, since a mode someone else could switch on would be surveillance wearing the word help, and a persistent banner states that the helper can see the screen and cannot press anything for them. The helper's name is entered by the participant, stays on the device and is never transmitted - the banner needs it to say something meaningful and nobody else has a use for it. Messages confirmed while assistance is on are marked, and the recipient is told that someone was helping the sender and could see the conversation; the reason is not authorship, which is genuinely the participant's, but that the conversation's audience is larger than the other party would otherwise assume, which is theirs to know. Stored as messages.sent_with_assistance - the fact only, never the helper's identity, because putting a third party the recipient has no relationship with into their conversation is neither necessary nor legitimate
  trace_ids: [ATR-002, ATR-024]
  adr_ids: [ADR-031, ADR-104]
  docs: ["design/DESIGN_DECISIONS.md D-15", "design/PARTICIPANT_WORKSPACE.md C7", "Doc 20 B13"]
  code: [packages/database/migrations/1753800000020_m18-assisted-send.sql, packages/modules/m18-community-social/src/application/messaging-commands.ts, packages/modules/m18-community-social/src/application/queries.ts, apps/web/src/components/AssistedMode.tsx, apps/web/src/components/MessagePanel.tsx, apps/web/src/App.tsx]
  tests: [apps/web/test/assisted-mode.test.tsx]
  status: implemented

- implementation_id: IMP-M05-OWN-ENROLMENT-001
  module: M05
  summary: A participant can see where they stand in a study and leave it from their own workspace. The withdrawal command was owner-permitted from the start, so a participant was always allowed to withdraw themselves - but nothing in their workspace could find the enrolment to withdraw from, so in practice leaving meant asking the people they were leaving, which is not the same right. Adds an owner-scoped listOwnEnrolments and a participant Home section that states the stage in plain words and offers the exit. The confirmation is honest about what leaving does and does not do - nothing new is collected, but information already inside a dataset locked for analysis is not removed because locked datasets are not rewritten, and consent choices and messages are separate and are not deleted. A reason is optional and the screen says so, because the right to withdraw cannot be made conditional on explaining yourself. No pause control is offered - Paused is a valid enrolment state but no command transitions into it, so the button would do nothing. An integration test caught a real permission error made while building this - granting participants the existing enrolment.view, which is the unscoped staff queue action, would have let any participant read every enrolment, and the empty result seen at first was the query filtering rather than the engine refusing; it is now a separate enrolment.view-own carrying ownerOnly, the same shape as participant.view-own
  trace_ids: [ATR-002, ATR-024]
  adr_ids: [ADR-050, ADR-054, ADR-060]
  docs: ["design/PARTICIPANT_WORKSPACE.md A1.3", "Doc 19 participant journey", "Doc 4 consent model"]
