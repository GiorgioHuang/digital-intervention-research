  tests: [packages/modules/m03-consent-permission/test/m03.integration.test.ts, apps/web/test/who-has-access.test.tsx]
  status: implemented

- implementation_id: IMP-M03-M17-SUPPORTER-ACCESS-001
  module: M03
  summary: A supporter can see who they support and on what terms, and can contribute without being handed an internal identifier. The supporter workspace asked for an archive id that appears nowhere in the product, so the whole contribution path was unusable by anyone who had not been told one out of band, and nothing told a supporter which people had named them or what the relationship permitted. Adds listRelationshipsForActor, scoped by the actor on the request context with no identifier parameter at all - there is nothing to point at somebody else's relationships with, which is the D-13 lesson applied at the design stage rather than after a test caught it - and findArchiveForContribution in M17, gated on life-story.contribute itself, so it hands out nothing the caller could not already act on and returns null rather than a refusal when the participant has not started a life story. Two things are deliberately withheld from the supporter. Consent state is not reported, because consent is the participant's and showing it would let a supporter infer something the participant did not choose to tell them; the screen says only that what they can actually do also depends on choices that are theirs and are not shown. Blocks are not reported either - a blocked person is not notified, so the relationship still reads Active while the action is refused, and the wording avoids presenting relationship state as a promise that anything will succeed. The permitted actions are translated into plain words and the dotted action keys never reach the screen. A relationship the participant has not decided on offers no way to write to them at all
