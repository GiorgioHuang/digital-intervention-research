- implementation_id: IMP-WEB-SHARED-DEVICE-001
  module: M18
  summary: Shared-device privacy and idle sign-out, the two things the platform's real setting needs and neither of which existed. A session on a community-centre tablet stayed open until somebody thought to close it, and nothing on the screen said whose session it was or how to leave it - signing out lived three taps deep inside Help. Shared-device mode is switched on by an explicit checkbox at sign-in and is never detected, because a guess about whether a device is communal is wrong often enough to matter and impossible to explain to the person it is wrong about. Ticking it shortens the idle limits from twenty and twenty-five minutes to five and seven, moves display preferences to storage that dies with the tab so the next user does not inherit the last one's settings, and puts a permanent inverse-colour bar on every screen carrying the current identity, a screen cover and a way out. The cover is an opaque block and never a blur, since a blur can be recovered well enough from a photograph of the screen and reads to someone with low vision as the display having gone wrong; it also marks everything behind it inert, without which tabbing walks every control on the page and a screen reader reads out exactly what the cover was raised to hide. The page title is now the same on every screen and names no role, because a tab reading Participant Workspace on a shared tablet tells the room that whoever last sat there is in the study. The idle warning says what will actually happen - the design's wording reassures the reader that what they wrote is saved as a draft, and this application saves no drafts anywhere, so that sentence would be a promise made at the moment it is broken; it says instead that unsent writing will be lost. The countdown is text with role=timer and is announced on the half minute through a separate polite region, since a number read out every second buries everything else. A shared device may be extended once and then not again, because unlimited extension is the same as no timeout at all. Three departures from the design are recorded as decisions D-18 to D-20. Measurement found two real defects - the first draft of the bar occupied 304px of an 844px viewport, over the 25 per cent ceiling design section D.5 puts on sticky elements, fixed to 169-197px by putting the two controls side by side, and de-stuck entirely at the two largest text sizes where it still reached 45 per cent - the people who enlarge text are the ones with least screen to spare. The warning could not meet that ceiling at all without deleting the sentence about what is lost, so it became a dialog rather than a sticky strip
  trace_ids: [ATR-002, ATR-014]
  adr_ids: [ADR-054, ADR-104]
