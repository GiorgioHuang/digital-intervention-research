- implementation_id: IMP-M03-RELATIONSHIP-GRANTS-ARE-HONOURABLE-001
  module: M03
  summary: A relationship's permitted actions were unvalidated free text, and that list is printed to the participant on the screen where they decide whether to grant it. proposeRelationship wrote permittedActions into the row verbatim while step four of the permission engine consults a relationship's list only for actions whose requirement carries requiresRelationship - three in the whole platform, seeing what is shared, writing to the participant, and offering life story contributions. Anything else stored there was read by nothing. That would be unremarkable as internal bookkeeping, and it is not internal - both the participant's who-has-access screen and the supporter's own list render every entry, under the heading saying what this would let them do, falling through to the raw string whenever no wording matched. So the one decision on this platform that is entirely the participant's own could be taken on a list the platform did not understand and would never honour, worded however the proposer chose. The staff screen has only ever offered the three real ones, so nothing legitimate is refused by this - it closes the gap between that screen and the route behind it, which validates nothing, there being no validation pipe at the HTTP boundary. The authorisable set is derived from the requirement table rather than restated, so a new relationship-bearing action is covered the day it is added and a hand-copied list cannot drift away from the engine. Both screens also stopped printing the raw action name - an entry the platform has no wording for now says it is recorded, that the platform does not recognise it and that it grants nothing. The text itself is still shown, because hiding what is on the record would leave the participant unable to ask about it, but it is never shown as a thing the relationship grants
