- implementation_id: IMP-M13-ANALYSIS-CHAIN-001
  module: M13
  summary: The analysis chain is reachable - plan, run, interpretation, finding, with the three approvals along it. Every step had a command and none had a screen, and each artefact refers to the one before it only by identifier, so the chain could not even be followed let alone built without driving the API directly. Adds listAnalysisWork under analysis-plan.draft and listAnalysisApprovals under approval-queue.view, a research-workspace section covering all four steps, and an approver screen covering the three decisions. Two things the screens must not overstate. Recording a run is not performing one - there is no compute engine here, and what is stored is a person's record that an analysis was run against exactly this dataset version and what it produced, so the control says Record this run rather than Run the analysis. And a run can only be made against a locked dataset version, which the server enforces by refusing anything else, so the picker offers locked versions only and says why rather than letting someone choose one and meet a refusal; each run then displays the manifest hash of the version it was made against, which is the point of locking before analysing - an interpretation is about a run and a run is about exactly that data. Runs are deliberately absent from the approval queue because nobody approves a run - it either happened or it did not, and putting it in a decision queue would suggest a judgement nobody is being asked for. Only finding.approve is MFA-tier, so the strong-authentication notice appears in the findings section alone; repeating it over the plan and interpretation sections would overstate what those cost and teach people to scroll past the one that is real, and a test asserts exactly one such notice is present
