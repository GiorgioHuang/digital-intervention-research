- implementation_id: IMP-APPROVAL-REFUSAL-001
  module: M04
  summary: Approvers can say no. Sweeping the database for values declared in a CHECK constraint that no code ever writes turned up the most consequential finding yet - all eight approval commands in the platform could only approve, and five of the artefacts already carried a refusal in their own state vocabulary that nothing could reach. Protocol versions, evidence decisions, analysis plans and research findings all had Rejected; evidence reviews had Returned for Revision. A decision screen whose only outcome is approval is not a decision screen, and it is worse than a missing feature - the only way for an approver to clear a queue was to approve everything in it, while the screen said you can decide this and offered one move. Separation of duties, exact versions, content hashes and confirmation dialogues were all built on top of a choice that was never there. A migration adds the refusal columns to the five tables, with a CHECK that the refuser is not the submitter, matching the approval rule, and a CHECK that a refusal without a reason is not a refusal at all. Refusing takes the same permission as approving, because they are one authority exercised two ways, which means refusing a research finding needs strong authentication exactly as approving one does - a refusal is not the cheap half of a decision. A reason is required because the person whose work is refused has to be able to find out why, and a refusal nobody can read is only a disappearance. Refusing an evidence decision deliberately writes no snapshot - a snapshot is the immutable record of what an agreed decision rested on, and a refused decision rests on nothing anyone may cite afterwards. The wording on each screen says what refusal does and does not do - a returned evidence review is not approved and is not thrown away, a refused finding leaves the interpretation and the run beneath it untouched. Three artefacts still cannot be refused because their state vocabularies contain no refusal at all - dataset definitions, interpretation records and report versions - which needs a vocabulary change rather than a column and is recorded as still open
