- implementation_id: IMP-M18-MODERATION-EFFECT-001
  module: M18
  summary: Moderation decisions now do what they say, and the ones the platform cannot carry out are no longer offered. This was the most serious instance of a control recording a decision nothing reads that this repository has held. Nothing anywhere reads moderation_decisions, and until now nothing wrote a post's state either - post_state carried Hidden, Removed and Restored in its CHECK constraint and only Published was ever written - so Remove content closed the case as Actioned, told the moderator it was done, and left the post sitting in the community feed. The moderator, the reporter and the person reported all came away believing something had happened. The community feed already shows only published posts, so the fix was the missing write - Hide, Remove and Restore now move the post's state in the same transaction as the decision, and a content decision on a case that names no content is refused rather than silently succeeding, with the case left open instead of closed. Escalating no longer closes the case as Actioned - pass this on and this is dealt with were the same button, and the case left the queue without anybody being passed anything - it now leaves the case open and in the queue. The panel is driven by the case rather than by a typed identifier, every decision states its actual effect beside the button and again in the confirmation, and Warn is reworded as a record of a conversation held elsewhere since the platform sends nothing. Restrict, Suspend, Disconnect, Ban and Escalate are not offered at all, because no account restriction mechanism exists anywhere in the code and no route from moderation to safety exists yet, and a section names them so a moderator who cannot find Suspend knows it is missing because the platform cannot do it rather than because the screen is hiding it. Reporting a post was the other half - the only report path was the Help screen typing somebody's identifier, so no report could ever name a post and the content decisions would have had nothing to act on. A post can now be reported from where it is, and who is being reported comes from the post rather than from the reporter, so a report cannot open a case against somebody the reporter names - which also keeps the author's identifier off the feed. The demo seed leaves one case naming real content and one about behaviour so the difference is visible. Verified against a running server - Remove on the behaviour case is refused and the case stays open, Hide on the content case succeeds, the post's state becomes Hidden and the post is gone from the feed
