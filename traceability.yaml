- implementation_id: IMP-M10-EVIDENCE-CHAIN-001
  module: M10
  summary: Searching the knowledge platform and building an evidence review from what comes back is reachable end to end. Searching was reachable and attaching a reference was reachable, but nothing listed a review - so one could be started, added to and submitted only by someone tracking identifiers outside the product, and the reviewer's queue at the end of the chain had nothing anyone could get to. Adds listEvidenceWork under evidence.reference and listReviewsAwaitingApproval under a new evidence-review.view-queue, plus an evidence section in the research workspace and a review-approval screen for the evidence reviewer. Three wording rules carry this screen. Source before assertion - a result leads with its source system, external identifier and version, and only then the title and the summary, because the summary is what a search system says about a paper while the source is what lets a reader decide whether to believe any of it. A failure to reach the knowledge platform is never rendered as an absence of evidence - the upstream 503 is shown as an error and no empty result list is drawn, since could not ask and there is nothing are different facts. And a reference that failed to resolve is not rendered as a citation - the platform stores it with the raw identifier as title and unknown as source, so each row states its resolution state and the approval screen counts how many were never confirmed and says outright that approving does not confirm them. A mistake was caught by the integration test rather than by review - the reviewer queue was first gated on evidence-review.approve, which is confirmationRequired, so the read failed demanding a confirmation it had no business making. That is the same defect the export.view-own split exists to prevent, and the fix is the same shape - a separate read action rather than folding it into approval-queue.view, which would have handed an evidence reviewer the protocol, dataset and export queues as well
