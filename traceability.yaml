- implementation_id: IMP-M03-VIEW-SHARED-INERT-001
  module: M03
  summary: The platform stopped describing a permission nothing reads as access to a participant's information. No checkPermission call anywhere in the codebase uses participant.view-shared - no query is gated on it, no screen would show a supporter anything a participant has shared, and a participant has no way to mark anything as shared in the first place, because the visibility control is unimplemented and life_story.access_grants has never had a row written to it. The action appeared in three places. It was the box ticked by default on the coordinator's screen for bringing a supporter in, it was described to the participant on their own who-has-access screen as seeing the parts of your information you have agreed to share, and it was described to the supporter in their workspace as seeing what they have chosen to share. So the shortest path through the product recorded an access right that does not exist and then asked the participant to approve it - they would believe they had shared their life story with somebody, and believe that revoking it took something back, while the supporter would go looking for a screen that does not exist and could reasonably conclude the participant had chosen to share nothing with them. Nothing is ticked by default now, the entry is marked as not in use and says that ticking it records an intention and grants no access at all, and choosing only inert permissions is called out where the choice is made rather than in a footnote. The participant's and supporter's screens say the permission is recorded and that nothing acts on it. The option is not withdrawn, because relationships already carry it and the intention is worth recording, but no screen may describe it as access until a participant can actually share something and a supporter can actually see it
