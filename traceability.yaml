- implementation_id: IMP-M03-OWN-RELATIONSHIPS-001
  module: M03
  summary: A participant can see who has, or has asked for, access to them, and can approve or end it. Approving and revoking an authorised relationship have always been ownerOnly, so the participant is the only person who may let a supporter in or shut one out - but no query listed relationships, which made both unreachable. A proposal sat waiting on an approval the participant could not see they had been asked for, and an active relationship could not be ended by the only person entitled to end it. This is the missing half of the consent screen. Consent answers what may be done with someone's information and a relationship answers by whom; the engine requires both, since participant.view-shared is gated on requiresRelationship and the supporter-involvement scope together, so a workspace showing only one half cannot state what is actually true of the participant's data. Adds listOwnRelationships under the existing owner-only participant.view-own, following the consent view rather than minting a new permission for the same act of reading one's own record, and a screen that names the person, states in plain words what the access would allow, and offers approve, refuse and end. The record version travels with each row because approve and revoke are optimistically concurrent and a list without it could not drive either. Ended, refused and expired relationships stay in the list - someone asking who has access to them is also entitled to know who used to - and carry no controls. Account display names are resolved in the composition root rather than inside M03, via a new AccountNameQueryPort on M01, so the module boundary stays one-way. The integration test caught a wording defect before it shipped - every relationship is created in PendingVerification and nothing in the platform verifies anything from that state, the participant's decision being the only transition out, so the screen words it identically to Proposed rather than saying details are being checked, which would describe a check nobody performs and invite someone to approve on the strength of it. The confirmations do not overclaim either - ending access cannot unsee what was already seen, does not remove contributions already accepted, and needs no reason
  trace_ids: [ATR-002, ATR-024]
  adr_ids: [ADR-050, ADR-054]
  docs: ["design/PARTICIPANT_WORKSPACE.md B2", "UI_INVENTORY.md B20", "Doc 4 relationship model"]
  code: [packages/modules/m03-consent-permission/src/application/consent-queries.ts, packages/modules/m03-consent-permission/src/index.ts, packages/modules/m01-identity-org/src/infrastructure/repository.ts, packages/modules/m01-identity-org/src/contracts/index.ts, apps/api/src/controllers.ts, apps/api/src/app.module.ts, apps/web/src/components/WhoHasAccess.tsx, apps/web/src/App.tsx]
  tests: [packages/modules/m03-consent-permission/test/m03.integration.test.ts, apps/web/test/who-has-access.test.tsx]
  status: implemented

- implementation_id: IMP-M03-M17-SUPPORTER-ACCESS-001
  module: M03
  summary: A supporter can see who they support and on what terms, and can contribute without being handed an internal identifier. The supporter workspace asked for an archive id that appears nowhere in the product, so the whole contribution path was unusable by anyone who had not been told one out of band, and nothing told a supporter which people had named them or what the relationship permitted. Adds listRelationshipsForActor, scoped by the actor on the request context with no identifier parameter at all - there is nothing to point at somebody else's relationships with, which is the D-13 lesson applied at the design stage rather than after a test caught it - and findArchiveForContribution in M17, gated on life-story.contribute itself, so it hands out nothing the caller could not already act on and returns null rather than a refusal when the participant has not started a life story. Two things are deliberately withheld from the supporter. Consent state is not reported, because consent is the participant's and showing it would let a supporter infer something the participant did not choose to tell them; the screen says only that what they can actually do also depends on choices that are theirs and are not shown. Blocks are not reported either - a blocked person is not notified, so the relationship still reads Active while the action is refused, and the wording avoids presenting relationship state as a promise that anything will succeed. The permitted actions are translated into plain words and the dotted action keys never reach the screen. A relationship the participant has not decided on offers no way to write to them at all
