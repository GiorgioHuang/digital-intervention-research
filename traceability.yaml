- implementation_id: IMP-M02-ADMIN-PARTICIPANTS-001
  module: M02
  summary: Administrative participant listing for one organisation (decision D-13), reached from a new Administration screen in the staff workspace. A new permission participant.list-administrative is held only by OrganisationAdministrator, requires the platform-administration purpose, and is deliberately not consent-gated - it returns an identifier, a name and an account state and no research content, and gating it on study-participation consent would make someone who withdrew vanish from the administration they still need. Protected existence (ADR-050) is not weakened - the dangerous shape is a lookup that takes an identifier from the caller and reveals whether it exists, and this takes no identifier, offers no text field, and enumerates inside a scope the administrator already holds. The organisation is read from the request context and is deliberately not a parameter or query string - the integration test caught a real hole while it was a parameter, because the engine prefers the resource's organisation over the context's, so an administrator scoped to organisation A could pass A while acting in B and be allowed; permission and data scope now derive from one value the caller cannot choose. Known gap stated on the screen - there is no direct participant-to-organisation link in the data model, only participant to account to organisation membership, so a participant registered without a platform account does not appear and the list is not a complete roll. Account creation was also not recording an organisation membership at all, which would have made the list permanently empty, so the demo seed now creates accounts within their organisation. SystemAdministrator does not receive this permission - running the platform and seeing the people in a study are different jobs
  trace_ids: [ATR-003, ATR-022]
