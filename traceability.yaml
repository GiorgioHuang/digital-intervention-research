- implementation_id: IMP-WEB-STATUS-VOCABULARY-001
  module: WEB
  summary: >-
    The owner's status-colour rules applied to the screens, and one claim of mine corrected on the
    way. I had said Delivery Unknown was probably showing as a red error; checking found that no
    status anywhere carries any colour at all - every one of them is a bare sentence, while the
    owner's brief asks for a status to be icon, words and colour together. The wording itself was
    already right (Doc 20 section 161: Provider Accepted means the delivery service took it, not that
    a person received it); what was wrong is that a screenful of identical grey sentences makes the
    reader parse each one to find out whether anything needs them, which is the work a status exists
    to save. Now one table decides tone, mark and words for every state, with each of the owner's
    rules held by an assertion. Provider Accepted and Delivered do not share a green - accepted is
    in-progress blue and green is kept for the single state where a person actually received
    something, because those two are the most confusable and the confusion runs the dangerous way.
    Delivery Unknown is warning and never danger, because "we do not know" and "it failed" are
    different facts and showing the first as the second tells somebody their message definitely did
    not arrive when nobody can say. Draft, Pending and Expired are quiet - none of them is a fault.
    Blocked is the low-saturation red the palette already uses, drawn as a line rather than a filled
    panel, because it is a boundary somebody set on purpose rather than an alarm. Wiring it up found
    a real defect: the supporter's conversation view printed the raw state name, so a supporter read
    the literal string "Provider Accepted" - exactly the reading the wording table exists to prevent
    - while the participant's own screen had been careful about it from the start. Two people in one
    conversation must not be told different things about whether a message arrived. One rule is
    deliberately not implemented: the owner asks for a confirmed SafetyEvent to use Error, and
    DESIGN_SYSTEM section A.1.3 with D-8 forbid danger for safety matters, safety having its own
    family precisely because a safety event is not a system error. That is a direct conflict in
    safety semantics and was put to the owner rather than settled quietly; they ruled for blue. What
    the rule was reaching for is not lost, only relocated: it wanted an unreviewed report and a
    confirmed event to stop looking alike, and checking found three quite different situations
    rendered identically - somebody mentioning a concern, a reviewer confirming it, and a case dealt
    with weeks ago. The gradation now lives inside the safety family. An unreviewed signal is
    warning, because nobody has confirmed anything and dressing it as confirmed overstates what is
    known about a person. A confirmed event that still needs somebody is the safety family at full
    strength. A resolved or closed one goes quiet, because a list where finished business looks like
    an open case is a list a reviewer stops reading - while never reading as success, since resolving
    a record does not resolve a risk, which the screen says in words beside it. Red appears nowhere
    in the safety table, which is the point of it. Wiring it up also collapsed a duplicate:
    EVENT_STATE_WORDING held a second copy of the same sentences, one use of which is the dialogue
    asking whether to move a safety record into a state - it has to quote the words the reviewer just
    read, not a paraphrase that has drifted from them - so it is now derived from the status table.
