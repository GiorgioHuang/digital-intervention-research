- implementation_id: IMP-M03-CONSENT-ASSISTANCE-001
  module: M03
  summary: A consent decision now records whether somebody was helping. The column assistance_recorded has been on the consent history since the first consent migration and no code ever set it, while the platform marks a chat message sent in assisted mode and tells its recipient so. The platform recorded that a person had help writing a note about seedlings and recorded nothing about whether anybody was sitting beside them when they agreed to take part in the study. For research with older people that is the wrong way round, because whether someone was present when a person consented is exactly the fact an ethics reviewer, a later question about capacity, or the participant themselves would need, and it cannot be reconstructed afterwards. Recording and withdrawing both carry the fact now, a migration puts it on the projection so the participant's own screen can state it about the choice standing right now, and the screen says at the top of the page that choices made while somebody is helping will be recorded that way - a fact recorded about a person that they did not know was being recorded is not a safeguard. What is never recorded is who was helping. The helper's name is entered by the participant and never leaves their device under D-15, and recording it would make their household a matter of study record; the test asserts no column of the consent history names a helper at all. Deciding alone is written as false rather than left absent, so no help is a fact and not a gap. The same change fixes a defect introduced by the re-consent work - the API client hardcoded templateVersion to ct_v1, which was harmless while no consent text could ever change and became wrong the moment one could, since a participant asked to agree to a revised wording would have been recorded as agreeing to the old one, the exact fact the demand existed to establish. The client now sends the version the participant is being shown, and falls back to ct_v1 only for a scope with no decision yet,