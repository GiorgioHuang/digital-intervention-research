- implementation_id: IMP-M14-REPORT-CHAIN-001
  module: M14
  summary: Writing and approving a research report is reachable. The row in the inventory is named reports and controlled export, and only the export half had any screen - nothing could create a report, draft a version or list one, so the approval step further along had nothing to approve. It is the same shape as the dataset chain, in the module next door, found by the same sweep of routes with no caller. Adds listReportVersionsAwaitingApproval for the approver and listReportWork for whoever writes, the latter read under report.create on the reasoning used throughout this sweep - if you may do the work, you may see where it has got to. Approved versions stay in the writer's list rather than leaving it, because a writer who cannot see that a version was approved has no way to tell whether to draft another, and approved content cannot be edited in place at all. Approval fixes the exact words - a database trigger refuses any change to an approved version other than superseding it - so the confirmation says that approving fixes these words as this version number and that a correction is a new version, rather than letting someone assume a typo can be fixed later. The author cannot approve their own version, enforced by the command and again by a database CHECK, and the row says so before the button rather than after a refused submission. Approving a report version is deliberately not labelled as strong-authentication work, because report.approve requires confirmation and not MFA - the same restraint applied to the dataset definition screen, for the same reason that overstating what an action costs teaches people to discount the notices that are real
