- implementation_id: IMP-WEB-BREAK-GLASS-001
  module: M15
  summary: Emergency access - the declaration and the review that follows it - reachable for the first time. Both commands and the pending-review query existed on the server with nothing calling any of them, so break-glass/pending-review was a queue nobody could look at and which could never have been filled through the product anyway. That is the same defect found earlier in the dataset and report chains, except this one sits on the platform's accountability path, where a queue nobody can see is the whole failure rather than an inconvenience. The wording is the substance of this change. Nothing in the codebase reads governance_audit.break_glass_records - the permission engine never consults it - so recording emergency access grants no access at all, and the expiry the record carries expires nothing. This is the same shape as recording an analysis run - the act happens outside the platform, at a console or at the database, and what the platform holds is the account of it - so the button says record and the screen says before anything else that no permission changes, with the expiry field carrying its own note that nothing switches off at that time. Naming this a door would be the most consequential lie available here, because someone in a real emergency would press it and believe they were in. The retrospective review is real - the record is itself the artefact and the review writes onto it whether it should have happened - and a person cannot review their own, which the command enforces and the row states before the buttons. The three outcomes each carry what they mean, and the not-justified wording says plainly that it does not undo anything. Governance holds are deliberately not offered - nothing reads governance_holds either, so a hold placed today would stop nothing while the artefact carried on being edited, approved and exported, and the person who placed it would stop looking for another way to stop it. The screen says so in a section of its own rather than leaving a gap to be guessed at. The demo seed now records one emergency access, left awaiting review, so the privacy reviewer's queue holds something real - the bootstrap administrator is the only role that may record one and the privacy reviewer the only role that may review one, which is the separation the rule depends on. Verified against a running server - the queue is refused to the administrator who recorded it, the recording is refused at password strength and accepted with MFA, and the review by a different actor succeeds
  trace_ids: [ATR-002, ATR-021]
  adr_ids: [ADR-051, ADR-054]
