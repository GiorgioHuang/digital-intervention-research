- implementation_id: IMP-M17-VISIBILITY-WITHHELD-001
  module: M17
  summary: Life story visibility and audience selection is deliberately not offered, recorded as decision D-16. The column is writable and changeVisibility works, but nothing reads it - the only query in the repository that reads life story items is getMyLifeStory, which is ownerOnly, so changing an item to Community or Connections produces an audience of exactly nobody. Offering that control would let a participant believe they had shared something when they had not; a lie in that direction is still a lie, it merely fails in a different way from believing something is private when it is public. Selected People is worse still - life_story.access_grants has no command that writes to it, only the bulk revoke performed on withdrawal, so it is an option with no way to select anyone. The life story screen therefore states each item's current visibility and offers no control to change it. Unlock condition - a non-owner read path that honours visibility and access_grants, and a command that writes an access grant; until both exist there is nothing here that can be controlled honestly. Recorded as deferred rather than implemented because the deliverable is the absence of a control and the reason for it
  trace_ids: [ATR-002]
  adr_ids: [ADR-023, ADR-020]
  docs: ["design/DESIGN_DECISIONS.md D-16", "design/PARTICIPANT_WORKSPACE.md B11", "UI_INVENTORY.md B11"]
