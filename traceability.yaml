- implementation_id: IMP-M14-EXPORT-CARRY-OUT-001
  module: M14
  summary: An approved export can now be carried out. Approving was the end of the road - the generate and delivery commands existed and had routes, but no query listed an approved request and no screen anywhere called them, so the package was never put together and the delivery was never recorded. A participant who asked for a copy of their own information could be told truthfully that it had been agreed to and then never hear another thing, not because anyone refused but because nothing could take the next step. Found by following the export path onward from the decision screen. Adds listExportsToCarryOut over the Approved, Generated and Delivered states, read under export.generate - the action that already permits doing the work, on the same reasoning as the archive lookup for contributors, since if you may do the work you may see what is waiting to be done, and deciding an export is a different job with a different action. Received is deliberately excluded, because leaving finished work in a list of work to do is how a queue stops being read. The screen keeps the three delivery states apart in words as Doc 16 section 37.3 requires - Approved says the package has not been put together, Generated says it exists and nothing has been handed over, Delivered says the recipient has not confirmed it - and the manifest hash appears only once there is one. The control that records delivery is labelled as recording what a person did rather than as delivering, because the platform sends nothing and a button called Deliver would claim a transfer that happened elsewhere if at all. Export expiry remains unimplemented - no command or column carries it
