- implementation_id: IMP-M18-PARTICIPANT-NAMES-001
  module: M18
  summary: Participants are named to each other instead of numbered (decision D-12). The community feed, conversation list and connection list rendered internal participant primary keys at other participants - a recorded defect, because a key shown to one person is a handle for correlating that person across every screen they appear on. M18's three read queries now resolve a display name through a narrow ParticipantNamePort declared in M18 and satisfied structurally by M02's query object, so the dependency stays one way and no module reaches into another's schema; the lookup is batched because a feed resolves up to a hundred authors and one query per author would be a query storm on the most-visited screen. A participant whose name cannot be resolved is described as "A community member", identical for everyone unresolved so the placeholder cannot be used to tell them apart, and never as an identifier. Known cost, stated rather than hidden - Doc 20 §354 forbids combining ParticipantProfile and PublicProfile, and PublicProfile is not implemented (B14), so every name shown to another participant currently comes from the research-side record and the participant cannot choose how they are called per §132; the community screen therefore says outright that a published post carries the name on the participant record and that no separate community name exists yet. Sweep deps in the worker and in the sweep tests throw rather than resolve names, so a sweep that ever needs one is a deliberate design change and not an unexplained placeholder in a log
