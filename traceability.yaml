- implementation_id: IMP-WEB-ABILITY-MODES-REACHABLE-001
  module: WEB
  summary: >-
    The two modes the owner ranks above a full dark mode - high contrast light, and low stimulation -
    opened and looked at rather than assumed. The verification was itself the finding: three styled
    modes had complete rule blocks in the stylesheet and no code anywhere set their attributes, the
    fifth appearance of that shape in this codebase. Handled by the rule D-75 established. Low
    stimulation had a working enforcement side and only wanted a writer, so it got one - a "use less
    colour" control that drops every tinted panel to plain page while the words, icons and edge
    stripes stay, which is safe to offer only because no state on this platform is carried by colour
    alone. Simplify was empty at both ends - no writer, and no element in the app carries .optional,
    so setting it could only have changed line height from 1.6 to 1.8, which the density preference
    already does - and was deleted rather than given a control that would read "simpler" and merely
    widen the leading. data-theme had no writer either, but its media-query path is live, so the
    duplicated attribute block went and prefers-color-scheme became dark mode's single definition:
    those forty hex values had to agree with the media query and nothing could report when they
    stopped agreeing, and the copy more likely to be edited is the one every OS-dark user actually
    travels. Behaviour for those users is unchanged. Separately, high contrast turned out to raise
    body text from 12.38:1 to 21:1 while leaving all ten semantic families untouched at their 4.50
    minimum - the faintest things on the page unchanged, for the one person who has said they cannot
    read the page. Every family now reaches AAA, asserted as strictly better than standard rather
    than merely passing, because a mode named for contrast that does not raise it is a label. A
    general guard now scans the stylesheet for :root[data-*=] selectors and requires each attribute
    to be written somewhere in src: the shape has been found by hand five times and should be found
    by a test the sixth. Corrected the same day: deleting the data-theme hook was the wrong half of
    that rule. The finding was right - nothing set the attribute - but the action for a capability
    with no writer is to add the writer, and removing the hook left anyone whose device is set to
    dark with no route back to the light design this project was drawn for, which the owner hit on
    their own phone within hours. Restoring one `:not([data-theme='light'])` is the entire
    implementation of an "always light" preference, because the light values are the base and setting
    the attribute simply stops the dark block matching; no palette is duplicated. "Always dark" is
    deliberately not offered - that direction would need a second full copy of the dark values, and a
    preference costing forty colours that must agree forever is not the cost of a switch. Following
    the device stays the default: somebody who set their whole phone to dark meant it, and what was
    missing was the way out, not a different default. The owner then ruled for three options - follow
    the device, light, dark - each carrying an icon and a word, and the ruling was right: whether
    somebody can choose matters more than whether I keep one fewer copy to maintain, and I had put my
    own maintenance cost ahead of the user's choice on the user's own screen. Dark on a light device
    does need the duplicate palette, so the duplicate is generated from the live block rather than
    transcribed, and an assertion now compares the two blocks token by token - key set and value -
    with the same check on the dark-plus-high-contrast pair, which is the copy most likely to be
    forgotten because it is the combination fewest people will ever open. Icon and word together: the
    glyph is aria-hidden and the word is the accessible name, since an icon alone makes somebody
    guess - a half-filled circle means "follow my device" to nobody who has not been told - and the
    glyphs are set one step larger because a sun or moon character occupies about half its em in most
    fonts and would otherwise be a dot. The tests query by accessible name rather than visible text,
    which is both what a screen reader announces and a check that the glyph really is out of the
    accessibility tree.
