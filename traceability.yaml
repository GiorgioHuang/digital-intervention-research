- implementation_id: IMP-WEB-ENROLMENT-CHAIN-001
  module: M05
  summary: The enrolment queue is driven by state rather than by hope, and the demo seed finally creates an enrolment at all. The coordinator panel put all four chain steps and the eligibility decision beside a box you typed an enrolment identifier into, every button enabled, with the enrolment's state shown nowhere on the screen. Only one of those buttons could ever succeed and which one was unknowable - pressing Activate on an invitation produced a refusal that was correct and useless, verified against a running server as INVALID_STATE_TRANSITION. Offering a control that cannot work is the same defect as offering one that does nothing, and it is how people learn to treat refusals as ordinary. Each enrolment now says where it has got to in words rather than as a bare state name, offers exactly the one step its state allows and says which state that step leads to, and shows the rest of the chain as text with an explanation that anything not offered is not being withheld but is not this enrolment's turn. The eligibility decision appears only while screening, which is the only state the command accepts it from, and it keeps its written reason and its statement that a person makes it and it is recorded in their name rather than being a score the system produced. Withdrawal is not offered on an enrolment that has already ended. Every action reloads the list, without which the row keeps the state it had before the step and the button on offer is the one that has just stopped working. The demo seed was the larger finding - the coordinator's workspace is the first tab staff land on and it was completely empty, because the seed created no enrolment and no research project, only a literal project identifier used by the later chains. The seed now creates a real project, drafts and submits a protocol version and has a different person approve it, leaves a second version in review so the protocol decision queue holds something, walks one participant's enrolment the whole way to Active so the later states are not hypothetical, and leaves the other at Screening, which is the one point in the chain where the platform is waiting for a person rather than for a step
