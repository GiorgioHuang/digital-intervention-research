- implementation_id: IMP-M07-DELIVERY-RECORD-001
  module: M07
  summary: What a participant actually received can be written down and read back. M07 held one command and nothing else - no query, no route, no screen - so an intervention could be drafted, approved and put into use while nobody could record that any participant had ever received it, and nobody could read back what had been recorded. On a platform whose whole subject is delivering digital interventions to older people, delivery was the part with no way in. Recording a session also unlocks the intervention-configuration screen that D-41 had deliberately refused to build, and for the reason that decision wrote for itself - a session cannot say what somebody was exposed to without naming the exact configuration it came from, so something now reads a configuration and the screen is no longer a control recording a decision nothing acts on. The wording carries the distinction the design states outright and that a screen can quietly destroy - this is actual exposure rather than intended exposure, and delivery is not effectiveness. Completed means the session ran to the end and nothing about whether it helped; letting those two read as one would turn a delivery log into an outcome claim that a study would then be reported on. Each of the nine exposure states carries its own sentence, so declining is recorded as the participant's own decision and a failure is recorded as a fault on the platform's side rather than theirs. session_state is never shown - it defaults to Completed and no code has ever written it, so the seeded row saying only part of it reached her simultaneously claims the session completed, and the test asserts that data fact directly rather than trusting the column
