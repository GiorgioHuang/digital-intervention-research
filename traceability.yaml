- implementation_id: IMP-M18-WAYS-OUT-001
  module: M18
  summary: You could join a community and connect to someone and never leave either. The same mechanical test that found the moderation defect - values declared in a CHECK constraint that no code ever writes - turned up a matched pair. membership_state carried Ended from the start and connection_state carried Disconnected, and no code path could write either. So taking part in a community is entirely optional was true exactly once, and the only exit from a connection was to block - which is a safety act that says something about the other person, so an ordinary parting had to be dressed up as an accusation. That is a pressure the platform should not put on anyone. Both enforcement halves already existed - the feed and the posting command require an Active membership, and the message commands refuse when the communication basis is not Active - so what was missing was only the way out. The decision that matters most is that leaving carries no consent precondition. Joining is gated on community-participation consent; gating the exit the same way would mean that withdrawing that consent trapped the person inside the community the consent had put them in, so the way out must never depend on the permission that let you in, and a test holds that leaving still works after the consent is withdrawn. Either party may end a connection alone, because requiring both to agree would leave whoever wants out waiting for the other to consent. The other person is not told - a notice saying someone has disconnected from you is an announcement about a decision to withdraw, and withdrawing quietly is part of what makes it safe to do. Ending a connection marks the threads resting on it Expired in the same transaction, a state whose wording already said exactly what happened and which nothing could reach - leaving them Active would show ongoing beside a conversation that refuses every send. Neither exit deletes anything, and both screens say so, because pretending otherwise would be the opposite mistake from the one being fixed
