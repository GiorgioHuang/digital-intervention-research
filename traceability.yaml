- implementation_id: IMP-M12-DATASET-CHAIN-001
  module: M12
  summary: The dataset chain can be walked through the product. It runs define, approve, generate, quality-review, lock - and only the last step had a screen. The four before it could be performed by nobody, which means the lock queue could never fill through the product no matter what an approver did, and a decision screen whose queue cannot be populated has never been used by anyone. Found by sweeping every API route for one with no caller anywhere in the web app, after the export gap showed the shape of the problem. Adds listDefinitionsAwaitingApproval for the approver and listDatasetWork for whoever prepares data, the latter read under dataset.define on the same reasoning used elsewhere - if you may do the work, you may see where it has got to - plus a dataset section in the research workspace and a definition-approval screen alongside the existing lock screen. Three things the wording has to get right. The variable dictionary is what goes into the dataset, message bodies are excluded by default under ADR-034 and anything not named is not included, so the approval confirmation says that next to the control rather than leaving it to be assumed. The drafter cannot approve their own definition, enforced by the command and again by a database CHECK, and the row says so before the button rather than after a failed submission. Completing the quality review is a person recording what they did, so it is not called approving and the screen says outright that it is not locking. Approving a definition is deliberately not labelled as strong-authentication work, because dataset.approve-definition requires confirmation and not MFA while locking requires both - overstating what an action costs is its own dishonesty and teaches people to ignore the notices that are real
