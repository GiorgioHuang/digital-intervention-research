- implementation_id: IMP-M18-RELATIONSHIP-MESSAGING-001
  module: M18
  summary: A participant can write to the family member they approved, and that person can read it and answer. basis_type had carried AuthorisedRelationship from the start with nothing able to write it - threads could only rest on a matched connection, so a participant could message a stranger the platform suggested and not the supporter they themselves authorised, while the wording for that basis sat unreachable in the messages screen. For a study about older people and connection that was the wrong way round. The ruling was that being written to is its own permission on the relationship rather than a consequence of being trusted to see things, so relationship.message is a separate action a participant grants by approving a relationship that names it - a participant who wanted a niece to read their life story and nothing more would otherwise have handed her a channel into their inbox by accident. All three things that had made this unbuildable are now in place. The supporter's inbox is keyed by actor rather than by participant, because a supporter has no participant record and without that query a thread could be written to them that they could never read, which is worse than no channel since the person writing believes they were heard. The action uses requiresRelationship and deliberately not ownerOnly, so the relationship's own permitted actions decide it rather than a role. And the ADR-031 basis re-evaluation now branches on the basis - for a relationship it checks the relationship is still active and still names the action, so a participant revoking it stops the conversation at that moment rather than at the next time somebody thinks to look. The participant opens the conversation and a supporter cannot start one. Sending is still confirmed for a supporter as for anyone else, guarded in the command rather than by making the action confirmationRequired, which would have demanded a confirmation to write a draft. The action is not gated on supporter-involvement consent - that scope governs a supporter seeing the participant's things, and writing to someone is a different act authorised by the relationship itself. One conversation per relationship, so the history is not split in two. Verified against a running server - the supporter finds the thread, reads it, has an unconfirmed send refused and a confirmed one accepted
