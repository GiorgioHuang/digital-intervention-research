- implementation_id: IMP-M17-OWN-LIFE-STORY-001
  module: M17
  summary: A participant can read their own life story. There was no read path anywhere - the permission catalogue did not contain a single life-story read action, so a participant could create items, revise them, confirm one as their own testimony, change who sees it and withdraw it, and a supporter could propose text into it, while nobody including the owner could look at what was there. The increment before this one gave the participant a way to accept or reject a supporter's contribution; accepting text into a story you cannot read is not a decision anyone can properly make, so this closes that gap rather than adding a feature beside it. Adds life-story.view-own as ownerPermitted and ownerOnly - a life story is not staff-readable by role, and sharing it with anyone else runs through visibility and access grants rather than through a read permission - plus getMyLifeStory, a participant screen that reads the story, writes new entries and confirms testimony on the exact version. Provenance is stated on each piece of text rather than in a legend elsewhere - who wrote it, whether the participant has confirmed it as their own words, and when an earlier version was confirmed but the current one is not, because editing deliberately does not carry confirmation forward and an item that merely looked unconfirmed would hide that it once was. Withdrawn items stay readable by their owner - withdrawal takes an item back from everyone else, it is not the platform deciding someone may not remember their own past. New entries are recorded as ParticipantAuthored because this screen has no drafting assistant (D-14) and any other provenance would be a false record. The archive is created on first write rather than up front, so someone who never writes anything is never left with an empty one. Integration tests pin down that the supporter who contributed, the coordinator and the administrator are all refused as RESOURCE_NOT_FOUND, and that the accepted supporter version reads as SupporterContribution and NotTestimony with the earlier confirmation visible but not carried over
  trace_ids: [ATR-007, ATR-002]
  adr_ids: [ADR-023, ADR-024, ADR-050]
  docs: ["design/PARTICIPANT_WORKSPACE.md B9", "design/UI_INVENTORY.md B9", "Doc 20 sections 109-118"]
