- implementation_id: IMP-M09-SAFETY-EVENTS-001
  module: M09
  summary: What happens after a safety event is confirmed. A SafetyEvent was created with event_state defaulting to Open and no code path could ever change it, no query listed one, and no screen showed one. The triage screen told the safety reviewer they had converted this to a safety event - which reads as an escalation to something that will be worked - and nothing worked it. This is the most serious record the platform holds, a person confirming that another person may be at risk, and it went into a table nobody could read and nobody could act on. The permission to read one already existed in the catalogue with nothing to read. A migration adds an append-only timeline, enforced by a database trigger, carrying both the actions people took and the moves the event made, so the account of what happened is one thing rather than two half-histories; a correction is a further entry with the original left standing, the same rule moderation decisions already carry, because a safety record that can be tidied up afterwards is not a record. The state machine lives in the command and the screen offers only the moves it allows. Three pieces of wording are the substance of this change. The screen says before anything else that the platform does nothing about a safety event on its own - it contacts nobody, restricts nothing and watches nothing, and everything shown is somebody writing down what they did. Choosing Resolved or Closed says plainly that this records the platform's part being finished and does not mean the person is safe, which is the most dangerous sentence available anywhere in this product. The note field says to write what was done and not what was said, because the content of a call belongs in the clinical record. An event with nothing recorded says that a blank is not a judgement, since a later reader cannot otherwise tell nothing was needed from nobody looked, and deciding that no action was needed is offered as a real answer. The design asks for how related the event is to the intervention and nothing anywhere records it, so the screen says so rather than leaving the question out silently. The demo seed leaves one signal awaiting triage and one carried through to a confirmed event with actions against it - the safety workspace previously had no signal in it at all. Verified against a running server, where the safety reviewer sees the event and the moderator gets a protected-existence 404
