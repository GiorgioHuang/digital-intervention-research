- implementation_id: IMP-M06-PORTFOLIO-VISIBLE-001
  module: M06
  summary: The intervention portfolio can be seen and worked. M06 had six routes - create an intervention, add a version, submit it, approve it, activate it, configure it against a project - and not one caller anywhere in the product, and it had no query of any kind, so an intervention created straight against the API was invisible from that moment on. The approver had two decisions to make with no way to learn anything was waiting, and the researcher who submitted a version could not find out what became of it. For a platform whose subject is digital interventions for older people, the interventions were the one thing nobody could look at. listInterventions returns each intervention with its versions, gated on a new intervention.view held by the researcher and the approver alike - they are the two sides of the exchange, and withholding the list from either makes the decisions unreachable. The researcher screen drafts an intervention, adds a version and submits it, and says plainly that approving and activating are not there because whoever approves cannot be whoever submitted. The approver screen is driven from the list so each row offers only the step its state accepts, and the confirmation before activating names the version it displaces, since one version at a time is in use by unique index and the word activate hides that it replaces rather than adds. The evidence grade is deliberately not shown. Nothing in the platform writes evidence_status or evidence_direction, so every row in the database carries the column defaults, and printing E0 beside an intervention would read as an assessment somebody made - the most misleading blank available on a platform about evidence. The screen says both are not recorded anywhere and that this is not an intervention that was assessed and came out low
