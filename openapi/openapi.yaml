# OpenAPI for the implemented HTTP surface (kept in lockstep with
# apps/api/src/controllers.ts; the e2e suite exercises every path).
# Conventions per Doc 15: explicit command endpoints, stable error codes,
# error envelope {error:{code,message,details,requestId,traceId,retryable}}.
openapi: 3.1.0
info:
  title: Healthy Aging Digital Intervention Research Platform API
  version: 0.1.0
  description: >
    Pilot MVP surface. Authentication: dev-header stub only (X-Actor-Id,
    X-Auth-Strength) — production OIDC pending ADR-104. Context headers:
    X-Organisation-Id, X-Research-Project-Id, X-Purpose-Code, X-Request-Id.
paths:
  /health:
    get: { summary: Liveness, responses: { '200': { description: ok } } }
  /ready:
    get: { summary: Readiness (DB reachable), responses: { '200': { description: ready }, '503': { description: not ready } } }
  /v1/participants/{participantId}/consents:
    post:
      summary: Record a granular consent decision (owner-only; M03, ADR-018)
      parameters: [{ name: participantId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, decision, templateVersion]
              properties:
                scope: { type: string }
                decision: { type: string, enum: [Granted, Declined, Restricted, Deferred] }
                templateVersion: { type: string }
      responses:
        '201': { description: ConsentDecision recorded }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/participants/{participantId}/consents/withdraw:
    post:
      summary: Withdraw consent for one scope (confirmed; emits ConsentWithdrawn atomically)
      parameters: [{ name: participantId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, templateVersion, confirmed]
              properties:
                scope: { type: string }
                templateVersion: { type: string }
                confirmed: { type: boolean }
      responses:
        '201': { description: Withdrawal recorded }
        '409': { description: CONFIRMATION_REQUIRED / INVALID_STATE_TRANSITION }
  /v1/conversation-threads:
    post:
      summary: Create a ConversationThread (requires a current approved CommunicationBasis, ADR-031)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionId, creatorParticipantId]
              properties:
                connectionId: { type: string }
                creatorParticipantId: { type: string }
      responses:
        '201': { description: Thread created }
        '403': { description: COMMUNICATION_BASIS_REQUIRED / BLOCKED_INTERACTION }
  /v1/conversation-threads/{threadId}/messages:
    post:
      summary: Create a Message Draft (never sends; delivery stays Not Submitted)
      parameters: [{ name: threadId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Draft created }
        '409': { description: CONVERSATION_THREAD_NOT_USABLE / THREAD_PARTICIPANT_MISMATCH }
  /v1/messages/{messageId}/confirm-send:
    post:
      summary: Exact SendConfirmation (actor + message version + recipient set; produces Queued, never Delivered)
      parameters: [{ name: messageId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senderParticipantId, expectedMessageVersion, recipientIds, confirmed]
              properties:
                senderParticipantId: { type: string }
                expectedMessageVersion: { type: integer }
                recipientIds: { type: array, items: { type: string } }
                confirmed: { type: boolean }
      responses:
        '201': { description: Confirmed and queued (lifecycleState Queued) }
        '409': { description: SEND_CONFIRMATION_MISMATCH / MESSAGE_ALREADY_QUEUED }
  /v1/blocks:
    post:
      summary: Create a BlockRecord (participant-owned decision, confirmed; ADR-037)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blockerId, blockedActorId, confirmed]
              properties:
                blockerId: { type: string }
                blockedActorId: { type: string }
                confirmed: { type: boolean }
      responses:
        '201': { description: Block created }
        '409': { description: CONFIRMATION_REQUIRED }
  /v1/blocks/{blockId}/revoke:
    post:
      summary: Revoke a Block (restores nothing the block suppressed, ADR-037)
      parameters: [{ name: blockId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blockerId, confirmed]
              properties:
                blockerId: { type: string }
                confirmed: { type: boolean }
      responses:
        '201': { description: Block revoked }
        '409': { description: CONFIRMATION_REQUIRED }
  /v1/reports:
    post:
      summary: Submit a UserReport; opens a ModerationCase atomically (human review; survives blocks, ADR-038)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reporterId, reportedActorId, category, description]
              properties:
                reporterId: { type: string }
                reportedActorId: { type: string }
                reportedContentId: { type: string }
                category: { type: string }
                description: { type: string }
      responses:
        '201': { description: Report submitted with moderationCaseId in meta }
  /v1/safety-signals:
    post:
      summary: Record a human-sourced SafetySignal (never blocked by role gaps; conversion to SafetyEvent stays human+MFA, ADR-039)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceType, category, severity, description]
              properties:
                sourceType: { type: string, enum: [Participant, Supporter, Staff] }
                category: { type: string }
                severity: { type: string, enum: [Low, Moderate, High, Critical] }
                description: { type: string }
      responses:
        '201': { description: SafetySignal recorded }
        '401': { $ref: '#/components/responses/Error' }
  /v1/safety-signals/{signalId}/triage:
    post:
      summary: Human triage disposition (confirmed; ADR-039). Conversion to a SafetyEvent additionally requires MFA and creates the event atomically — automation can never do this.
      parameters: [{ name: signalId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition, reason, confirmed]
              properties:
                disposition: { type: string, enum: ['Closed as Not a Safety Event', Escalated, 'Converted to Safety Event'] }
                reason: { type: string }
                confirmed: { type: boolean }
      responses:
        '201': { description: Disposition recorded; safetyEventId in meta on conversion }
        '401': { description: STEP_UP_AUTHENTICATION_REQUIRED for conversion without MFA }
        '404': { description: Protected existence — non-reviewers learn nothing }
        '409': { description: CONFIRMATION_REQUIRED / INVALID_STATE_TRANSITION }
  /v1/match-preferences:
    post:
      summary: Opt in to matching (owner-only, requires open-matching consent + confirmation; ADR-036)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, declaredAttributes, confirmed]
              properties:
                participantId: { type: string }
                declaredAttributes: { type: object }
                confirmed: { type: boolean }
      responses:
        '201': { description: MatchPreference active }
        '404': { description: RESOURCE_NOT_FOUND (protected existence — includes consent-missing denials, ADR-050) }
  /v1/match-candidates/{candidateId}/decision:
    post:
      summary: Record an independent, version-bound MatchDecision; mutualAcceptanceId in meta only when both parties chose Interested
      parameters: [{ name: candidateId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, expectedCandidateVersion, decision, confirmed]
              properties:
                participantId: { type: string }
                expectedCandidateVersion: { type: integer }
                decision: { type: string, enum: [Interested, 'Not Now', Dismissed, Blocked, Reported] }
                confirmed: { type: boolean }
      responses:
        '201': { description: Decision recorded }
        '404': { description: RESOURCE_NOT_FOUND }
        '409': { description: MATCH_CANDIDATE_EXPIRED / VERSION_CONFLICT / CONFIRMATION_REQUIRED }
  /v1/mutual-acceptances/{mutualAcceptanceId}/activate-connection:
    post:
      summary: Activate a Connection from a single-use MutualAcceptance (confirmed; consumed exactly once)
      parameters: [{ name: mutualAcceptanceId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, confirmed]
              properties:
                participantId: { type: string }
                confirmed: { type: boolean }
      responses:
        '201': { description: Connection active }
        '409': { description: MUTUAL_ACCEPTANCE_CONSUMED / CONFIRMATION_REQUIRED }
  /v1/relationships:
    post:
      summary: Propose a relationship (coordinator). A proposal grants NOTHING until the participant approves it themselves (Doc 4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, relatedActorId, relationshipType, permittedActions]
              properties:
                participantId: { type: string }
                relatedActorId: { type: string }
                relationshipType: { type: string }
                permittedActions: { type: array, items: { type: string } }
                expiresAt: { type: string, format: date-time }
      responses: { '201': { description: Proposed } }
  /v1/relationships/{relationshipId}/approve:
    post:
      summary: Owner-only, confirmed, version-bound approval — nobody accepts a relationship on the participant's behalf
      parameters: [{ name: relationshipId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Active }
        '403': { description: AUTHORISATION_DENIED for non-owners }
        '409': { description: CONFIRMATION_REQUIRED }
        '412': { description: VERSION_CONFLICT — not the version the participant saw }
  /v1/relationships/{relationshipId}/revoke:
    post:
      summary: Owner revokes at any time (version-bound)
      parameters: [{ name: relationshipId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Revoked }, '412': { description: VERSION_CONFLICT } }
  /v1/life-story/archives:
    post: { summary: Create the participant's LifeStoryArchive (one per participant; owner-only), responses: { '201': { description: created }, '404': { description: protected existence } } }
  /v1/life-story/archives/{archiveId}/items:
    post:
      summary: Create a LifeStoryItem with its first version (owner-only; versions are immutable)
      parameters: [{ name: archiveId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: item + versionId in meta }, '404': { description: protected existence } }
  /v1/life-story/items/{itemId}/revise:
    post: { summary: Add a new immutable version (ParticipantAuthored / AIDraft / Transcription), parameters: [{ name: itemId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: new versionId in meta } } }
  /v1/life-story/items/{itemId}/confirm-testimony:
    post:
      summary: Confirm the EXACT version as Participant Testimony (owner, confirmed; AI drafts and contributions never become testimony implicitly, ADR-042)
      parameters: [{ name: itemId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: version is now ParticipantTestimony }
        '412': { description: VERSION_CONFLICT — not the version shown, or already confirmed }
  /v1/life-story/items/{itemId}/visibility:
    post:
      summary: Change visibility (owner, confirmed). Internet Public is feature-disabled for the first Pilot — refused by command AND DB CHECK (ADR-020)
      parameters: [{ name: itemId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: visibility changed }
        '400': { description: UNSUPPORTED_CAPABILITY for Internet Public }
  /v1/life-story/archives/{archiveId}/contributions:
    post:
      summary: Propose a supporter contribution (requires approved relationship + supporter-contribution consent + no block)
      parameters: [{ name: archiveId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Proposed }, '404': { description: protected existence when relationship/consent missing } }
  /v1/life-story/contributions/{contributionId}/review:
    post:
      summary: Archive owner accepts/rejects a contribution; acceptance creates a SupporterContribution version — never testimony
      parameters: [{ name: contributionId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: reviewed; versionId in meta on acceptance }, '404': { description: only the owner reviews } }
  /v1/life-story/items/{itemId}/withdraw:
    post: { summary: Withdraw an item (owner, confirmed), parameters: [{ name: itemId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Withdrawn } } }
  /v1/conversation-threads/{threadId}/messages:
    get:
      summary: Message history — thread parties only (non-parties get protected-existence 404); drafts are private to their author and never shown to the other party; delivery states arrive untranslated for truthful rendering
      parameters:
        - { name: threadId, in: path, required: true, schema: { type: string } }
        - { name: participantId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: messages ordered by creation time }
        '404': { $ref: '#/components/responses/Error' }
  /v1/participants/{participantId}/connections:
    get:
      summary: List own connections (owner-only view; strangers get protected-existence 404, ADR-050)
      parameters: [{ name: participantId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Connection summaries (id, otherParticipantId, state) }
        '404': { $ref: '#/components/responses/Error' }
  /v1/participants/{participantId}/conversation-threads:
    get:
      summary: List own conversation threads (owner-only view)
      parameters: [{ name: participantId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Thread summaries (id, otherParticipantId, basisType, state) }
        '404': { $ref: '#/components/responses/Error' }
  /v1/participants/{participantId}/match-candidates:
    get:
      summary: List own current match candidates — explanation and version only, never the other participant's identity before mutual acceptance
      parameters: [{ name: participantId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Candidate summaries (id, candidateVersion, explanation, expiresAt) }
        '404': { $ref: '#/components/responses/Error' }
  /v1/research-projects:
    post:
      summary: Create a ResearchProject (M04)
      responses: { '201': { description: created }, '403': { $ref: '#/components/responses/Error' } }
  /v1/research-projects/{projectId}/protocol-versions:
    post:
      summary: Draft a ProtocolVersion bound to the project
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: draft created } }
  /v1/protocol-versions/{versionId}/submit:
    post:
      summary: Submit a ProtocolVersion for review (records submitter for separation of duties)
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: In Review } }
  /v1/protocol-versions/{versionId}/approve:
    post:
      summary: Approve a ProtocolVersion (human, confirmed, MFA; approver ≠ submitter, ADR-051)
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Approved }
        '401': { description: STEP_UP_AUTHENTICATION_REQUIRED without MFA }
        '403': { description: SEPARATION_OF_DUTIES / AUTHORISATION_DENIED }
  /v1/protocol-versions/{versionId}/activate:
    post:
      summary: Activate an approved ProtocolVersion (supersedes any previously active version)
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Active } }
  /v1/interventions:
    post: { summary: Create an Intervention (M06), responses: { '201': { description: created } } }
  /v1/interventions/{interventionId}/versions:
    post: { summary: Draft an InterventionVersion (immutable once approved), parameters: [{ name: interventionId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: draft created } } }
  /v1/intervention-versions/{versionId}/submit:
    post: { summary: Submit an InterventionVersion for review (records submitter), parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: In Review } } }
  /v1/intervention-versions/{versionId}/approve:
    post:
      summary: Approve an InterventionVersion (human, confirmed, MFA; approver ≠ submitter)
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Approved }
        '401': { description: STEP_UP_AUTHENTICATION_REQUIRED without MFA }
  /v1/intervention-versions/{versionId}/activate:
    post: { summary: Activate an approved InterventionVersion (supersedes previously active), parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Active } } }
  /v1/intervention-configurations:
    post:
      summary: Bind exact protocol + intervention versions into a configuration (Approved/Active intervention versions only)
      responses:
        '201': { description: created }
        '409': { description: RESOURCE_STATE_BLOCKED for draft/in-review intervention versions }
  /v1/enrolments/invite:
    post:
      summary: Invite a participant against an Approved/Active ProtocolVersion only (ATR-004)
      responses: { '201': { description: Invited }, '409': { description: PROTOCOL_VERSION_NOT_ACTIVE } }
  /v1/enrolments/{enrolmentId}/start-screening:
    post: { summary: Screening begins, parameters: [{ name: enrolmentId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Screening } } }
  /v1/enrolments/{enrolmentId}/eligibility-decision:
    post:
      summary: Record an EligibilityDecision (human authority only; service accounts refused)
      parameters: [{ name: enrolmentId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: recorded }, '409': { description: CONFIRMATION_REQUIRED } }
  /v1/enrolments/{enrolmentId}/start-consent:
    post: { summary: Consent process begins, parameters: [{ name: enrolmentId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Consenting } } }
  /v1/enrolments/{enrolmentId}/enrol:
    post: { summary: Enrol after granted study consent, parameters: [{ name: enrolmentId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Enrolled } } }
  /v1/enrolments/{enrolmentId}/activate:
    post: { summary: Activate enrolment, parameters: [{ name: enrolmentId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Active } } }
  /v1/enrolments/{enrolmentId}/withdraw:
    post:
      summary: Withdraw from the study (confirmed; propagation per Doc 19 — locked datasets are not rewritten)
      parameters: [{ name: enrolmentId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Withdrawn }, '409': { description: CONFIRMATION_REQUIRED } }
  /v1/dataset-definitions:
    post: { summary: Create a DatasetDefinition (M12), responses: { '201': { description: created } } }
  /v1/dataset-definitions/{definitionId}/approve:
    post: { summary: Approve a DatasetDefinition (confirmed), parameters: [{ name: definitionId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Approved } } }
  /v1/dataset-definitions/{definitionId}/versions:
    post: { summary: Generate a DatasetVersion (manifest + hash), parameters: [{ name: definitionId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Generated } } }
  /v1/dataset-versions/{versionId}/complete-quality-review:
    post: { summary: Complete quality review, parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Quality Reviewed } } }
  /v1/dataset-versions/{versionId}/lock:
    post:
      summary: DatasetLock — human + MFA + confirmed; locked versions become immutable (ATR-013)
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Locked }
        '401': { description: STEP_UP_AUTHENTICATION_REQUIRED without MFA }
  /v1/safety-signals/pending-triage:
    get: { summary: 'Safety reviewer work queue: signals still open for triage (role-gated read; seeing a queue is not deciding it)', responses: { '200': { description: signal list }, '403': { $ref: '#/components/responses/Error' } } }
  /v1/protocol-versions/in-review:
    get: { summary: 'Approver queue: protocol versions awaiting review, naming the submitter so separation of duties is visible up front', responses: { '200': { description: version list }, '403': { $ref: '#/components/responses/Error' } } }
  /v1/approvals/pending:
    get: { summary: 'Approver queue: open M15 approval requests', responses: { '200': { description: approval list }, '403': { $ref: '#/components/responses/Error' } } }
  /v1/dataset-versions/lockable:
    get: { summary: 'Approver queue: quality-reviewed dataset versions eligible for DatasetLock', responses: { '200': { description: version list }, '403': { $ref: '#/components/responses/Error' } } }
  /v1/export-requests/pending:
    get: { summary: 'Approver queue: export requests awaiting decision (decided requests leave the queue)', responses: { '200': { description: request list }, '403': { $ref: '#/components/responses/Error' } } }
  /v1/break-glass/pending-review:
    get: { summary: 'Privacy reviewer queue: break-glass records awaiting mandatory retrospective review', responses: { '200': { description: record list }, '403': { $ref: '#/components/responses/Error' } } }
  /v1/enrolments:
    get:
      summary: 'Coordinator list: enrolments with states, optionally filtered by researchProjectId'
      parameters: [{ name: researchProjectId, in: query, required: false, schema: { type: string } }]
      responses: { '200': { description: enrolment list }, '403': { $ref: '#/components/responses/Error' } }
  /v1/research-reports:
    post: { summary: Create a Report (M14; 'research-reports' avoids colliding with /v1/reports user reports), responses: { '201': { description: created } } }
  /v1/research-reports/{reportId}/versions:
    post: { summary: Draft a ReportVersion, parameters: [{ name: reportId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: draft with versionNumber } } }
  /v1/report-versions/{versionId}/approve:
    post:
      summary: Approve a report version (confirmed; approver ≠ author, code + DB CHECK); approved content becomes immutable (DB trigger)
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Approved }, '403': { description: self-approval refused }, '409': { description: not a draft } }
  /v1/export-requests:
    post:
      summary: Request a research export — purpose, recipient, EXACT sources, restrictions, de-identification; identifiable research exports are impossible (type + DB CHECK, Doc 16 §37.2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, recipient, sources, deIdentification]
              properties:
                purpose: { type: string }
                recipient: { type: string }
                sources: { type: array, items: { type: string } }
                restrictions: { type: string }
                deIdentification: { type: string, enum: [Pseudonymised, Anonymised] }
      responses: { '201': { description: Requested } }
  /v1/export-requests/{exportRequestId}/decide:
    post:
      summary: Export decision — human + confirmed + MFA, decider ≠ requester
      parameters: [{ name: exportRequestId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Approved / Rejected }
        '401': { description: STEP_UP_AUTHENTICATION_REQUIRED without MFA }
  /v1/export-requests/{exportRequestId}/generate:
    post:
      summary: Generate the package (manifest + sha256 hash) for an APPROVED export only
      parameters: [{ name: exportRequestId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Generated with manifestHash }, '409': { description: APPROVAL_REQUIRED } }
  /v1/export-requests/{exportRequestId}/delivery:
    post:
      summary: Record delivery state — Generated ≠ Delivered ≠ Received, forward transitions only (Doc 16 §37.3)
      parameters: [{ name: exportRequestId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: state recorded }, '409': { description: INVALID_STATE_TRANSITION on skipped states } }
  /v1/participants/{participantId}/export-requests:
    post:
      summary: Participant portability export (owner-only, confirmed; own permitted records only, third-party restrictions preserved, Doc 16 §37.5)
      parameters: [{ name: participantId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Requested }, '404': { description: protected existence }, '409': { description: CONFIRMATION_REQUIRED } }
  /v1/approvals:
    post:
      summary: Request an ApprovalRecord for one EXACT artefact type/id/version (M15, Doc 16 §38.1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artefactType, artefactId, artefactVersion]
              properties:
                artefactType: { type: string }
                artefactId: { type: string }
                artefactVersion: { type: integer }
      responses: { '201': { description: Requested } }
  /v1/approvals/{approvalRecordId}/decide:
    post:
      summary: Decide an approval — human + confirmed + MFA; the requester can never decide (ADR-051, code + DB CHECK); stores decision auth strength as reviewer-authority evidence
      parameters: [{ name: approvalRecordId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Approved / Rejected (terminal) }
        '401': { description: STEP_UP_AUTHENTICATION_REQUIRED without MFA }
        '403': { description: Self-approval refused }
        '409': { description: INVALID_STATE_TRANSITION — already decided }
  /v1/governance-holds:
    post: { summary: Place a GovernanceHold on an artefact (reviewer, confirmed), responses: { '201': { description: Active } } }
  /v1/governance-holds/{governanceHoldId}/lift:
    post: { summary: Lift a hold (reviewer, confirmed; lifted holds are terminal), parameters: [{ name: governanceHoldId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Lifted }, '409': { description: INVALID_STATE_TRANSITION } } }
  /v1/break-glass:
    post:
      summary: Record break-glass emergency access — MFA + confirmed with explicit reason/scope/expiry; born Pending Review (Doc 16 §38.5)
      responses:
        '201': { description: Recorded, awaiting mandatory retrospective review }
        '401': { description: STEP_UP_AUTHENTICATION_REQUIRED without MFA }
  /v1/break-glass/{breakGlassId}/review:
    post:
      summary: Mandatory retrospective review — never by the executor (code + DB CHECK); reviewer role is disjoint from execution by design
      parameters: [{ name: breakGlassId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Reviewed with outcome }
        '403': { description: Executor self-review refused }
  /v1/analysis-plans:
    post: { summary: Draft an AnalysisPlan (M13), responses: { '201': { description: Draft } } }
  /v1/analysis-plans/{planId}/approve:
    post: { summary: Approve an AnalysisPlan (confirmed), parameters: [{ name: planId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Approved } } }
  /v1/analysis-runs:
    post:
      summary: Run an analysis — locked DatasetVersion + approved plan only (ATR-013)
      responses: { '201': { description: Run recorded }, '409': { description: DATASET_NOT_LOCKED / PLAN_NOT_APPROVED } }
  /v1/analysis-runs/{runId}/interpretations:
    post: { summary: 'Draft an InterpretationRecord (Output ≠ Interpretation)', parameters: [{ name: runId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Draft } } }
  /v1/interpretations/{interpretationId}/approve:
    post: { summary: Approve an interpretation (confirmed), parameters: [{ name: interpretationId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Approved } } }
  /v1/interpretations/{interpretationId}/findings:
    post: { summary: 'Draft a ResearchFinding (Interpretation ≠ Finding)', parameters: [{ name: interpretationId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Draft } } }
  /v1/findings/{findingId}/approve:
    post:
      summary: Approve a ResearchFinding (human, confirmed, MFA)
      parameters: [{ name: findingId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Approved }
        '401': { description: STEP_UP_AUTHENTICATION_REQUIRED without MFA }
components:
  responses:
    Error:
      description: Doc 15 error envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  requestId: { type: string }
                  traceId: { type: string }
                  retryable: { type: boolean }
