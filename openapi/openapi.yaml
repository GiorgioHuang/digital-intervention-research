# OpenAPI for the implemented HTTP surface (kept in lockstep with
# apps/api/src/controllers.ts; the e2e suite exercises every path).
# Conventions per Doc 15: explicit command endpoints, stable error codes,
# error envelope {error:{code,message,details,requestId,traceId,retryable}}.
openapi: 3.1.0
info:
  title: Healthy Aging Digital Intervention Research Platform API
  version: 0.1.0
  description: >
    Pilot MVP surface. Authentication: dev-header stub only (X-Actor-Id,
    X-Auth-Strength) — production OIDC pending ADR-104. Context headers:
    X-Organisation-Id, X-Research-Project-Id, X-Purpose-Code, X-Request-Id.
paths:
  /health:
    get: { summary: Liveness, responses: { '200': { description: ok } } }
  /ready:
    get: { summary: Readiness (DB reachable), responses: { '200': { description: ready }, '503': { description: not ready } } }
  /v1/participants/{participantId}/consents:
    post:
      summary: Record a granular consent decision (owner-only; M03, ADR-018)
      parameters: [{ name: participantId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, decision, templateVersion]
              properties:
                scope: { type: string }
                decision: { type: string, enum: [Granted, Declined, Restricted, Deferred] }
                templateVersion: { type: string }
      responses:
        '201': { description: ConsentDecision recorded }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/participants/{participantId}/consents/withdraw:
    post:
      summary: Withdraw consent for one scope (confirmed; emits ConsentWithdrawn atomically)
      parameters: [{ name: participantId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, templateVersion, confirmed]
              properties:
                scope: { type: string }
                templateVersion: { type: string }
                confirmed: { type: boolean }
      responses:
        '201': { description: Withdrawal recorded }
        '409': { description: CONFIRMATION_REQUIRED / INVALID_STATE_TRANSITION }
  /v1/conversation-threads:
    post:
      summary: Create a ConversationThread (requires a current approved CommunicationBasis, ADR-031)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionId, creatorParticipantId]
              properties:
                connectionId: { type: string }
                creatorParticipantId: { type: string }
      responses:
        '201': { description: Thread created }
        '403': { description: COMMUNICATION_BASIS_REQUIRED / BLOCKED_INTERACTION }
  /v1/conversation-threads/{threadId}/messages:
    post:
      summary: Create a Message Draft (never sends; delivery stays Not Submitted)
      parameters: [{ name: threadId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Draft created }
        '409': { description: CONVERSATION_THREAD_NOT_USABLE / THREAD_PARTICIPANT_MISMATCH }
  /v1/messages/{messageId}/confirm-send:
    post:
      summary: Exact SendConfirmation (actor + message version + recipient set; produces Queued, never Delivered)
      parameters: [{ name: messageId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senderParticipantId, expectedMessageVersion, recipientIds, confirmed]
              properties:
                senderParticipantId: { type: string }
                expectedMessageVersion: { type: integer }
                recipientIds: { type: array, items: { type: string } }
                confirmed: { type: boolean }
      responses:
        '201': { description: Confirmed and queued (lifecycleState Queued) }
        '409': { description: SEND_CONFIRMATION_MISMATCH / MESSAGE_ALREADY_QUEUED }
  /v1/blocks:
    post:
      summary: Create a BlockRecord (participant-owned decision, confirmed; ADR-037)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blockerId, blockedActorId, confirmed]
              properties:
                blockerId: { type: string }
                blockedActorId: { type: string }
                confirmed: { type: boolean }
      responses:
        '201': { description: Block created }
        '409': { description: CONFIRMATION_REQUIRED }
  /v1/blocks/{blockId}/revoke:
    post:
      summary: Revoke a Block (restores nothing the block suppressed, ADR-037)
      parameters: [{ name: blockId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blockerId, confirmed]
              properties:
                blockerId: { type: string }
                confirmed: { type: boolean }
      responses:
        '201': { description: Block revoked }
        '409': { description: CONFIRMATION_REQUIRED }
  /v1/reports:
    post:
      summary: Submit a UserReport; opens a ModerationCase atomically (human review; survives blocks, ADR-038)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reporterId, reportedActorId, category, description]
              properties:
                reporterId: { type: string }
                reportedActorId: { type: string }
                reportedContentId: { type: string }
                category: { type: string }
                description: { type: string }
      responses:
        '201': { description: Report submitted with moderationCaseId in meta }
  /v1/safety-signals:
    post:
      summary: Record a human-sourced SafetySignal (never blocked by role gaps; conversion to SafetyEvent stays human+MFA, ADR-039)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceType, category, severity, description]
              properties:
                sourceType: { type: string, enum: [Participant, Supporter, Staff] }
                category: { type: string }
                severity: { type: string, enum: [Low, Moderate, High, Critical] }
                description: { type: string }
      responses:
        '201': { description: SafetySignal recorded }
        '401': { $ref: '#/components/responses/Error' }
  /v1/match-preferences:
    post:
      summary: Opt in to matching (owner-only, requires open-matching consent + confirmation; ADR-036)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, declaredAttributes, confirmed]
              properties:
                participantId: { type: string }
                declaredAttributes: { type: object }
                confirmed: { type: boolean }
      responses:
        '201': { description: MatchPreference active }
        '404': { description: RESOURCE_NOT_FOUND (protected existence — includes consent-missing denials, ADR-050) }
  /v1/match-candidates/{candidateId}/decision:
    post:
      summary: Record an independent, version-bound MatchDecision; mutualAcceptanceId in meta only when both parties chose Interested
      parameters: [{ name: candidateId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, expectedCandidateVersion, decision, confirmed]
              properties:
                participantId: { type: string }
                expectedCandidateVersion: { type: integer }
                decision: { type: string, enum: [Interested, 'Not Now', Dismissed, Blocked, Reported] }
                confirmed: { type: boolean }
      responses:
        '201': { description: Decision recorded }
        '404': { description: RESOURCE_NOT_FOUND }
        '409': { description: MATCH_CANDIDATE_EXPIRED / VERSION_CONFLICT / CONFIRMATION_REQUIRED }
  /v1/mutual-acceptances/{mutualAcceptanceId}/activate-connection:
    post:
      summary: Activate a Connection from a single-use MutualAcceptance (confirmed; consumed exactly once)
      parameters: [{ name: mutualAcceptanceId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, confirmed]
              properties:
                participantId: { type: string }
                confirmed: { type: boolean }
      responses:
        '201': { description: Connection active }
        '409': { description: MUTUAL_ACCEPTANCE_CONSUMED / CONFIRMATION_REQUIRED }
  /v1/participants/{participantId}/connections:
    get:
      summary: List own connections (owner-only view; strangers get protected-existence 404, ADR-050)
      parameters: [{ name: participantId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Connection summaries (id, otherParticipantId, state) }
        '404': { $ref: '#/components/responses/Error' }
  /v1/participants/{participantId}/conversation-threads:
    get:
      summary: List own conversation threads (owner-only view)
      parameters: [{ name: participantId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Thread summaries (id, otherParticipantId, basisType, state) }
        '404': { $ref: '#/components/responses/Error' }
  /v1/participants/{participantId}/match-candidates:
    get:
      summary: List own current match candidates — explanation and version only, never the other participant's identity before mutual acceptance
      parameters: [{ name: participantId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Candidate summaries (id, candidateVersion, explanation, expiresAt) }
        '404': { $ref: '#/components/responses/Error' }
  /v1/research-projects:
    post:
      summary: Create a ResearchProject (M04)
      responses: { '201': { description: created }, '403': { $ref: '#/components/responses/Error' } }
  /v1/research-projects/{projectId}/protocol-versions:
    post:
      summary: Draft a ProtocolVersion bound to the project
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: draft created } }
  /v1/protocol-versions/{versionId}/submit:
    post:
      summary: Submit a ProtocolVersion for review (records submitter for separation of duties)
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: In Review } }
  /v1/protocol-versions/{versionId}/approve:
    post:
      summary: Approve a ProtocolVersion (human, confirmed, MFA; approver ≠ submitter, ADR-051)
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Approved }
        '401': { description: STEP_UP_AUTHENTICATION_REQUIRED without MFA }
        '403': { description: SEPARATION_OF_DUTIES / AUTHORISATION_DENIED }
  /v1/protocol-versions/{versionId}/activate:
    post:
      summary: Activate an approved ProtocolVersion (supersedes any previously active version)
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Active } }
  /v1/enrolments/invite:
    post:
      summary: Invite a participant against an Approved/Active ProtocolVersion only (ATR-004)
      responses: { '201': { description: Invited }, '409': { description: PROTOCOL_VERSION_NOT_ACTIVE } }
  /v1/enrolments/{enrolmentId}/start-screening:
    post: { summary: Screening begins, parameters: [{ name: enrolmentId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Screening } } }
  /v1/enrolments/{enrolmentId}/eligibility-decision:
    post:
      summary: Record an EligibilityDecision (human authority only; service accounts refused)
      parameters: [{ name: enrolmentId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: recorded }, '409': { description: CONFIRMATION_REQUIRED } }
  /v1/enrolments/{enrolmentId}/start-consent:
    post: { summary: Consent process begins, parameters: [{ name: enrolmentId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Consenting } } }
  /v1/enrolments/{enrolmentId}/enrol:
    post: { summary: Enrol after granted study consent, parameters: [{ name: enrolmentId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Enrolled } } }
  /v1/enrolments/{enrolmentId}/activate:
    post: { summary: Activate enrolment, parameters: [{ name: enrolmentId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Active } } }
  /v1/enrolments/{enrolmentId}/withdraw:
    post:
      summary: Withdraw from the study (confirmed; propagation per Doc 19 — locked datasets are not rewritten)
      parameters: [{ name: enrolmentId, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Withdrawn }, '409': { description: CONFIRMATION_REQUIRED } }
  /v1/dataset-definitions:
    post: { summary: Create a DatasetDefinition (M12), responses: { '201': { description: created } } }
  /v1/dataset-definitions/{definitionId}/approve:
    post: { summary: Approve a DatasetDefinition (confirmed), parameters: [{ name: definitionId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Approved } } }
  /v1/dataset-definitions/{definitionId}/versions:
    post: { summary: Generate a DatasetVersion (manifest + hash), parameters: [{ name: definitionId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Generated } } }
  /v1/dataset-versions/{versionId}/complete-quality-review:
    post: { summary: Complete quality review, parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Quality Reviewed } } }
  /v1/dataset-versions/{versionId}/lock:
    post:
      summary: DatasetLock — human + MFA + confirmed; locked versions become immutable (ATR-013)
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Locked }
        '401': { description: STEP_UP_AUTHENTICATION_REQUIRED without MFA }
  /v1/analysis-plans:
    post: { summary: Draft an AnalysisPlan (M13), responses: { '201': { description: Draft } } }
  /v1/analysis-plans/{planId}/approve:
    post: { summary: Approve an AnalysisPlan (confirmed), parameters: [{ name: planId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Approved } } }
  /v1/analysis-runs:
    post:
      summary: Run an analysis — locked DatasetVersion + approved plan only (ATR-013)
      responses: { '201': { description: Run recorded }, '409': { description: DATASET_NOT_LOCKED / PLAN_NOT_APPROVED } }
  /v1/analysis-runs/{runId}/interpretations:
    post: { summary: 'Draft an InterpretationRecord (Output ≠ Interpretation)', parameters: [{ name: runId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Draft } } }
  /v1/interpretations/{interpretationId}/approve:
    post: { summary: Approve an interpretation (confirmed), parameters: [{ name: interpretationId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Approved } } }
  /v1/interpretations/{interpretationId}/findings:
    post: { summary: 'Draft a ResearchFinding (Interpretation ≠ Finding)', parameters: [{ name: interpretationId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Draft } } }
  /v1/findings/{findingId}/approve:
    post:
      summary: Approve a ResearchFinding (human, confirmed, MFA)
      parameters: [{ name: findingId, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Approved }
        '401': { description: STEP_UP_AUTHENTICATION_REQUIRED without MFA }
components:
  responses:
    Error:
      description: Doc 15 error envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  requestId: { type: string }
                  traceId: { type: string }
                  retryable: { type: boolean }
